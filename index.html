<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Etsu English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    --bg: #0B1120;
    --surface: #131B2E;
    --surface-2: #1B2540;
    --line: #263352;
    --text: #EDEFF5;
    --muted: #A9B2C6;
    --accent: #E85A2A;
    --accent-dim: #7A3018;
    --good: #4ADE80;
    --bad: #F87171;
    --radius: 14px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .display {
    font-family: 'Bebas Neue', 'Inter', system-ui, sans-serif;
    letter-spacing: 0.02em;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  header.topbar {
    padding: 18px 20px 14px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--bg);
    z-index: 5;
  }
  header.topbar .brand { font-family:'Bebas Neue'; font-size: 26px; letter-spacing: 0.03em; }
  header.topbar .brand span { color: var(--accent); }
  header.topbar .streak { font-size: 13px; color: var(--muted); display:flex; align-items:center; gap:5px; }
  header.topbar .streak b { color: var(--accent); font-weight:700; }

  main { flex: 1; padding: 20px 20px 100px; }

  /* ---- HOME ---- */
  .hero {
    background: linear-gradient(160deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 20px;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: "";
    position: absolute; right: -30px; bottom: -30px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent-dim) 0%, transparent 70%);
  }
  .hero .greet { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
  .hero .goal { font-family:'Bebas Neue'; font-size: 34px; line-height:1.05; margin: 0; }
  .hero .goal em { font-style: normal; color: var(--accent); }
  .hero .sub { font-size: 13px; color: var(--muted); margin-top: 8px; }

  .tasklist { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .task {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color .15s ease, transform .1s ease;
  }
  .task:active { transform: scale(0.98); }
  .task.done { opacity: 0.55; }
  .task .icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
    background: var(--surface-2);
  }
  .task .body { flex: 1; min-width: 0; }
  .task .body .name { font-weight: 600; font-size: 15px; }
  .task .body .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .task .check {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--line);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--bg);
  }
  .task.done .check { background: var(--good); border-color: var(--good); }

  .cta {
    display: block; width: 100%;
    background: var(--accent);
    color: #1A0A02;
    border: none;
    border-radius: var(--radius);
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
    letter-spacing: 0.01em;
  }
  .cta:active { filter: brightness(0.92); }
  .cta.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    font-weight: 600;
  }

  .statgrid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .statcard { background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .statcard .num { font-family:'Bebas Neue'; font-size: 26px; color: var(--accent); }
  .statcard .lbl { font-size: 12px; color: var(--muted); margin-top:2px; }

  /* ---- SCREEN HEADER ---- */
  .screen-head { display:flex; align-items:center; gap: 12px; margin-bottom: 18px; }
  .backbtn {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--surface); border:1px solid var(--line);
    color: var(--text); font-size: 18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .screen-title { font-family:'Bebas Neue'; font-size: 26px; }
  .screen-title .sec { color: var(--muted); font-size: 13px; font-family:'Inter'; display:block; margin-top:2px; font-weight:600; }

  /* ---- VOCAB ---- */
  .progressbar { height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-bottom: 22px; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s ease; }
  .qword { text-align:center; margin: 10px 0 26px; }
  .qword .w { font-family:'Bebas Neue','Inter',sans-serif; font-size: 44px; color: var(--text); }
  .qword .hint { color: var(--muted); font-size: 14px; font-weight: 600; margin-top: 8px; }
  .qword .cat { display: inline-block; color: var(--accent); font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; margin-top: 10px; }
  .options { display:flex; flex-direction:column; gap: 10px; }
  .opt {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px;
    font-size: 15px; text-align:left; cursor:pointer; color: var(--text);
  }
  .opt.correct { border-color: var(--good); background: rgba(74,222,128,0.1); }
  .opt.wrong { border-color: var(--bad); background: rgba(248,113,113,0.1); }
  .opt:disabled { cursor: default; }

  .resultcard { text-align:center; padding: 30px 10px; }
  .resultcard .score { font-family:'Bebas Neue'; font-size: 56px; color: var(--accent); }
  .resultcard .msg { color: var(--muted); font-size: 14px; margin: 6px 0 24px; }

  /* ---- CONVERSATION ---- */
  .themegrid { display:flex; flex-direction:column; gap: 8px; }
  .themebtn {
    background: var(--surface); border:1px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px;
    display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; color: var(--text); font-size: 14.5px; font-weight: 500;
  }
  .themebtn .jp { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .themebtn .arrow { color: var(--accent); font-size: 18px; }

  .bubble { border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; font-size: 14.5px; line-height:1.5; }
  .bubble.npc { background: var(--surface); border:1px solid var(--line); }
  .bubble.npc .who { font-size: 11.5px; color: var(--accent); font-weight:700; margin-bottom: 4px; letter-spacing:.03em; }
  .tapword { border-bottom: 1px dotted var(--muted); cursor: pointer; }
  .tapword:active { color: var(--accent); border-bottom-color: var(--accent); }
  .bubble.me { background: var(--surface-2); border:1px solid var(--line); margin-left: 26px; }
  .bubble.me .who { font-size: 11.5px; color: var(--muted); font-weight:700; margin-bottom: 4px; letter-spacing:.03em; }
  .bubble.thinking { color: var(--muted); font-style: normal; }
  .pron { margin-top:8px; font-size:13.5px; color: var(--text); }
  .pron .ipa { font-family: 'Inter', sans-serif; }
  .pron .kana { color: var(--muted); font-size:12.5px; margin-left:6px; }
  .pron .kana b { color: var(--accent); }
  .pron .caution { font-size:11px; color: var(--muted); margin-top:3px; }
  .speakbtn { display:inline-block; cursor:pointer; padding:0 6px; font-size:15px; user-select:none; }
  .toolrow { display:flex; gap:8px; margin-bottom:8px; }
  .toolrow .cta { flex:1; margin:0; padding:10px; font-size:14px; }
  .replytime { font-size:11px; color: var(--muted); margin-top:4px; }
  .dot { display:inline-block; width:5px; height:5px; border-radius:50%; background: var(--muted); margin-right:3px; animation: blink 1.2s infinite; }
  .dot:nth-child(2){ animation-delay: .2s; } .dot:nth-child(3){ animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }

  .evalcard { border-radius: var(--radius); border:1px solid var(--line); background: var(--surface); padding: 14px 16px; margin-bottom: 14px; }
  .evalcard .row { display:flex; gap: 8px; margin-bottom: 8px; font-size: 14px; }
  .evalcard .row .k { color: var(--muted); flex-shrink:0; min-width: 90px; font-weight:600; }
  .evalcard .row.better .k { color: var(--accent); }
  .evalcard .row.point { border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 2px; }
  .evalcard .row.point .k { color: var(--muted); }
  .pill { display:inline-block; font-size: 11px; font-weight:700; padding: 3px 9px; border-radius: 20px; margin-left: 6px; vertical-align: middle; }
  .pill.ok { background: rgba(74,222,128,0.15); color: var(--good); }
  .pill.issue { background: rgba(248,113,113,0.15); color: var(--bad); }
  .pill.high { background: rgba(248,113,113,0.15); color: var(--bad); }
  .pill.medium { background: rgba(232,90,42,0.15); color: var(--accent); }
  .pill.low { background: rgba(139,147,167,0.15); color: var(--muted); }

  .finishbar { display:flex; gap: 10px; margin-top: 4px; }
  .finishbar .cta { flex:1; }
  .duebadge { font-size: 12px; color: var(--accent); font-weight: 700; margin-left: 8px; }

  textarea.answer {
    width: 100%; min-height: 90px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); color: var(--text);
    padding: 14px 16px; font-size: 15px; font-family: inherit;
    resize: vertical; margin-bottom: 12px;
  }
  textarea.answer:focus { outline: none; border-color: var(--accent); }

  .feedback { display:flex; flex-direction:column; gap: 12px; margin-top: 6px; }
  .fbrow { background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .fbrow .lbl { font-size: 11.5px; color: var(--accent); font-weight:700; letter-spacing:.03em; margin-bottom: 6px; }
  .fbrow .val { font-size: 14.5px; line-height: 1.5; }
  .fbrow.natural .val { font-style: normal; }

  /* ---- REVIEW ---- */
  .empty { text-align:center; padding: 60px 20px; color: var(--muted); }
  .empty .big { font-size: 40px; margin-bottom: 10px; }
  .reviewcard { margin-bottom: 4px; }
  .reviewcard .jp { font-size: 16px; margin-bottom: 14px; line-height:1.5; }
  input.answer {
    width: 100%; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); color: var(--text);
    padding: 14px 16px; font-size: 15px; font-family: inherit;
    margin-bottom: 12px;
  }
  input.answer:focus { outline: none; border-color: var(--accent); }
  .correctbox { background: rgba(74,222,128,0.1); border:1px solid var(--good); border-radius: var(--radius); padding: 14px 16px; margin-top: 6px; }
  .correctbox .lbl { font-size: 11.5px; color: var(--good); font-weight:700; margin-bottom: 4px; }

  /* ---- NAV ---- */
  nav.tabbar {
    position: sticky; bottom: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--bg);
    border-top: 1px solid var(--line);
    display: flex;
    max-width: 480px; margin: 0 auto; width: 100%;
  }
  nav.tabbar button {
    flex: 1; background: none; border: none; color: var(--muted);
    padding: 10px 4px 8px; font-size: 11px; font-family: inherit; font-weight: 600;
    display:flex; flex-direction: column; align-items:center; gap: 4px;
    cursor: pointer;
  }
  nav.tabbar button .ic { font-size: 19px; }
  nav.tabbar button.active { color: var(--accent); }

  ::selection { background: var(--accent-dim); }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">ETSU <span>ENGLISH</span></div>
    <div class="streak">🔥 <b id="streakCount">0</b>日連続</div>
  </header>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="home"><span class="ic">🏠</span>ホーム</button>
    <button data-tab="vocab"><span class="ic">🔤</span>単語</button>
    <button data-tab="conversation"><span class="ic">💬</span>会話</button>
    <button data-tab="review"><span class="ic">🔁</span>復習</button>
    <button data-tab="test"><span class="ic">📝</span>テスト</button>
  </nav>
</div>

function kanaHtml(k) { return escapeHtml(k || "").replace(/\[([^\]]+)\]/g, "<b>$1</b>"); }
// word: {w, ipa?, kana?}。IPAを主、カタカナは補助として表示し、🔊で実際の音を確認できる。
function pronHtml(word) {
  if (!word || !word.w) return "";
  const p = PRON[(word.w || "").toLowerCase()];
  const ipa = word.ipa || (p && p[0]) || "";
  const kana = word.kana || (p && p[1]) || "";
  return `<div class="pron">
    <span class="speakbtn" data-speak="${escapeHtml(word.w)}">🔊</span>
    ${ipa ? `<span class="ipa">/${escapeHtml(ipa)}/</span>` : ""}
    ${kana ? `<span class="kana">${kanaHtml(kana)}</span>` : ""}
    ${kana ? `<div class="caution">※カタカナは目安です。正しい発音は🔊とIPAで確認しよう（太字＝強く読む部分）。</div>` : ""}
  </div>`;
}

/* ---- SPEECH (読み上げ＝speechSynthesis / 音声入力＝SpeechRecognition。Safari対応、未対応端末では非表示) ---- */
function speakText(text) {
  try {
    if (!window.speechSynthesis || !text) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    const voices = window.speechSynthesis.getVoices() || [];
    const v = voices.find(x => /en[-_]CA/i.test(x.lang)) || voices.find(x => /en[-_]US/i.test(x.lang));
    if (v) u.voice = v;
    u.rate = 1;
    window.speechSynthesis.speak(u);
  } catch (e) { console.warn("speak failed", e); }
}
// 画面のどこでも data-speak を持つ要素をタップすると読み上げる。
document.addEventListener("click", (e) => {
  const el = e.target.closest && e.target.closest("[data-speak]");
  if (el) { e.stopPropagation(); speakText(el.dataset.speak); }
}, true);
function speechRecognitionAvailable() {
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}

function isoDate(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function addDaysIso(baseIso, days) {
  const d = new Date(baseIso + "T00:00:00");
  d.setDate(d.getDate() + days);
  return isoDate(d);
}
function todayStr() { return isoDate(new Date()); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

const main = document.getElementById("main");
const tabbar = document.getElementById("tabbar");

let testSession = null;

function go(tab) {
  currentTab = tab;
  if (tab === "vocab") vocabSession = null;
  if (tab === "conversation") convoSession = null;
  stopMic(null);
  if (tab === "review") reviewSession = null;
  if (tab === "test") testSession = null;
  render();
}
tabbar.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-tab]");
  if (btn) go(btn.dataset.tab);
});

function render() {
  document.getElementById("streakCount").textContent = state.streak;
  [...tabbar.children].forEach(b => b.classList.toggle("active", b.dataset.tab === currentTab));
  if (currentTab === "home") renderHome();
  else if (currentTab === "vocab") renderVocab();
  else if (currentTab === "conversation") renderConversation();
  else if (currentTab === "review") renderReview();
  else if (currentTab === "test") renderTest();
  else if (currentTab === "diag") renderDiag();
  window.scrollTo(0,0);
}

/* ---- HOME ---- */

  const d = state.todayDone;
  const allDone = d.vocab && d.conversation && d.review;
  const nextTab = !d.vocab ? "vocab" : !d.conversation ? "conversation" : !d.review ? "review" : "vocab";
  const recoveryBanner = storageRecoveryNotice ? `
    <div class="evalcard" id="recoveryBanner" style="border-color:var(--accent);">
      <div class="row"><div class="k">⚠️ 復元</div><div>この端末の保存領域（localStorage）が空になっていたため、バックアップ（${storageRecoverySource || "IndexedDB"}）から学習データを復元しました。もし今後も繰り返す場合、ブラウザの「プライベートブラウジング」や「サイト間トラッキング防止」の設定がこのアプリの保存を制限している可能性があります。</div></div>
      <button class="cta secondary" id="dismissRecovery" style="margin-top:10px;width:100%;">了解</button>
    </div>
  ` : "";
  main.innerHTML = `
    ${recoveryBanner}
    <div class="hero">
      <p class="greet">Etsu、おかえり 👋</p>
      <p class="goal">5000mで<em>13分30秒</em><br>を切ろう。</p>

    <div class="statgrid">

      <div class="statcard"><div class="num">${dueTodayItems().length}</div><div class="lbl">本日の復習予定</div></div>
    </div>

    ${(() => {
      const tally = {};
      (state.srsItems || []).filter(i => !i.mastered).forEach(i => tallyWeakPoints(tally, i.mistakeType));

      const times = state.replyTimeLog || [];

      if (!top.length && avg == null) return "";
      return `<div class="evalcard">

        <div class="row"><div class="k">ヒント</div><div>累計 ${state.hintTotal || 0}回</div></div>

    })()}
    <div class="tasklist">

/* ---- DIAG (on-device storage diagnostic — not a real screen, reached only via the Home link) ---- */

  if (!st) return "データなし（null）";
  const td = st.todayDone || {};
  return `todayDate: ${st.todayDate || "(なし)"} / todayDone: 単語=${!!td.vocab} 会話=${!!td.conversation} 復習=${!!td.review} / srsItems: ${st.srsItems ? st.srsItems.length : 0}件 / vocabTotal: ${st.vocabTotal || 0} / streak: ${st.streak || 0}`;
}

    <div class="evalcard">

    <p style="font-size:12px;color:var(--muted);margin:8px 8px 18px;line-height:1.6;">

      A・B・C・Dの todayDone がすべて false なのに、直前で単語に✓が付いていた場合 → 保存自体が失われています。<br>

/* ---- VOCAB ---- */
function buildVocabItems(n, typePool) {
  n = n || 5;
  const picked = pick(WORD_BANK, Math.min(n, WORD_BANK.length));
  return picked.map(w => {
    let type;
    if (typePool) {
      type = typePool[Math.floor(Math.random() * typePool.length)];
    } else {
      const r = Math.random();
      if (r < 0.30) type = "jp2en";
      else if (r < 0.50) type = "en2jp";
      else if (r < 0.75) type = "cloze";
      else if (r < 0.90) type = "produce";
      else type = "mcq";
    }
    const item = { word: w, type };
    if (type === "mcq") {
      item.options = shuffle([w.jp, ...w.distractors]);
    }
    return item;
  });
}

function renderVocab() {
  if (!vocabSession) {
    vocabSession = {
      items: buildVocabItems(), idx: 0, correctCount: 0,
      answered: false, revealed: false, busy: false, evalResult: null, finished: false
    };
  }
  const s = vocabSession;

  if (s.finished) {
    main.innerHTML = `
      <div class="screen-head">
        <div class="backbtn" id="backHome">←</div>
        <div class="screen-title">単語<span class="sec">セッション完了</span></div>
      </div>
      <div class="resultcard">
        <div class="score">${s.correctCount}/${s.items.length}</div>
        <p class="msg">${s.correctCount===s.items.length ? "満点！ナイス。" : "間違えた単語は復習に保存されました。"}</p>
        <button class="cta" id="toHomeBtn">ホームに戻る</button>
      </div>`;
    document.getElementById("backHome").addEventListener("click", () => go("home"));
    document.getElementById("toHomeBtn").addEventListener("click", () => go("home"));
    return;
  }

  const it = s.items[s.idx];
  const w = it.word;
  const catTag = w.category ? `<div class="cat">${w.category}</div>` : "";

  const head = `
    <div class="screen-head">
      <div class="backbtn" id="backHome">←</div>
      <div class="screen-title">単語<span class="sec">問題 ${s.idx+1} / ${s.items.length}</span></div>
    </div>
    <div class="progressbar"><div style="width:${(s.idx/s.items.length)*100}%"></div></div>
  `;

  if (it.type === "mcq") {
    main.innerHTML = head + `
      <div class="qword">
        <div class="w">${w.w}</div>
        <div class="hint">この単語の意味は？</div>
        ${pronHtml(w)}
      </div>
      <div class="options" id="opts">
        ${it.options.map(o => `<button class="opt" data-val="${o}">${o}</button>`).join("")}
      </div>`;
    bindBack();
    main.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (s.answered) return;
        s.answered = true;
        const isCorrect = btn.dataset.val === w.jp;
        main.querySelectorAll(".opt").forEach(b => {
          b.disabled = true;
          if (b.dataset.val === w.jp) b.classList.add("correct");
          else if (b === btn) b.classList.add("wrong");
        });
        gradeAndContinue(isCorrect ? "correct" : "incorrect", 800);
      });
    });
    return;
  }

  if (it.type === "jp2en" || it.type === "en2jp" || it.type === "cloze") {
    const prompt = it.type === "jp2en" ? w.jp
      : it.type === "en2jp" ? w.w
      : w.example.replace("___", "＿＿＿");
    const hint = it.type === "jp2en" ? "この意味の英単語を入力しよう"
      : it.type === "en2jp" ? "日本語の意味を入力しよう"
      : "空欄に入る単語を入力しよう";
    const placeholder = it.type === "en2jp" ? "日本語で入力…" : "英語で入力…";
    // Bebas Neue is a thin, all-caps display font — fine for a single short English word (en2jp),
    // but hard to read for a full sentence (cloze) or Japanese text (jp2en, which it can't even
    // render), so those two switch to bold Inter instead.
    const wordStyle = it.type === "en2jp"
      ? "font-family:'Bebas Neue','Inter',sans-serif;font-size:36px;"
      : it.type === "cloze"
        ? "font-family:'Inter',sans-serif;font-weight:700;font-size:19px;line-height:1.5;"
        : "font-family:'Inter',sans-serif;font-weight:700;font-size:28px;line-height:1.3;";
    main.innerHTML = head + `
      <div class="qword">
        <div class="w" style="${wordStyle}">${prompt}</div>
        <div class="hint">${hint}</div>
        ${catTag}
      </div>
      <input class="answer" id="vocabInput" placeholder="${placeholder}" autocomplete="off" ${s.revealed || s.checking ? "disabled" : ""}>
      ${s.revealed ? "" : `<button class="cta" id="vocabCheck" ${s.checking ? "disabled" : ""}>${s.checking ? "判定中…" : "確認"}</button>`}
      ${s.revealed ? renderRecallFeedback(it, w, s) + pronHtml(w) : ""}
      ${s.revealed ? `<button class="cta" id="vocabNext" style="margin-top:12px;width:100%;">次へ</button>` : ""}
    `;
    bindBack();
    if (!s.revealed) {
      const check = document.getElementById("vocabCheck");
      const inputEl = document.getElementById("vocabInput");
      if (!s.checking) inputEl.focus();
      const doCheck = async () => {
        const val = inputEl.value.trim();
        if (!val || s.checking) return;
        s.lastInput = val;
        s.checking = true;
        render();
        if (it.type === "en2jp") {
          s.lastVerdict = await classifyJapaneseAnswer(val, w);
          s.lastNatural = null;
          s.lastNote = null;
        } else {
          const contextSentence = it.type === "cloze" ? w.example.replace("___", "____") : null;
          const res = await classifyEnglishAnswer(val, w, contextSentence);
          s.lastVerdict = res.verdict;
          s.lastNatural = res.natural || null;
          s.lastNote = res.note || null;
        }
        s.checking = false;
        s.revealed = true;
        render();
      };
      check.addEventListener("click", doCheck);
      inputEl.addEventListener("keydown", e => { if (e.key === "Enter") doCheck(); });
    } else {
      document.getElementById("vocabNext").addEventListener("click", () => {
        gradeAndContinue(s.lastVerdict, 0);
      });
    }
    return;
  }

  if (it.type === "produce") {
    main.innerHTML = head + `
      <div class="qword">
        <div class="w">${w.w}</div>
        <div class="hint">${w.jp}${w.category ? " · " + w.category : ""}</div>
      </div>
      <textarea class="answer" id="vocabSentence" placeholder="この単語を使って短い英文を作ってみよう" ${s.busy ? "disabled" : ""}>${s.draftText || ""}</textarea>
      ${s.evalResult ? "" : `<button class="cta" id="vocabProduceCheck" ${s.busy ? "disabled" : ""} style="width:100%;">${s.busy ? "確認中…" : "添削してもらう"}</button>`}
      ${s.inputWarning && !s.evalResult ? `<div style="margin:8px 0;font-size:13px;color:var(--accent);font-weight:600;">⚠️ ${s.inputWarning}</div>` : ""}
      <div id="produceEvalArea"></div>
      ${s.evalResult ? `<button class="cta" id="vocabNext" style="width:100%;margin-top:6px;">次へ</button>` : ""}
    `;
    bindBack();
    if (s.evalResult) {
      const r = s.evalResult;
      const passed = r.wordUsed && r.grammarCorrect;
      let feedbackHtml;
      if (!r.wordUsed) {
        // Deterministic rejection: word wasn't found in the sentence — no AI leniency involved.
        feedbackHtml = `
          <div class="correctbox" style="background:rgba(248,113,113,0.1);border-color:var(--bad);">
            <div class="lbl" style="color:var(--bad);">❌ 不正解</div>
            <div style="margin:6px 0 2px;"><b>あなたの回答：</b> ${escapeHtml(s.draftText || "（空欄）")}</div>
            <div style="margin:2px 0;"><b>正解：</b> 「${w.w}」を使った英文（例：${w.example.replace("___", w.w)}）</div>
            <div style="margin:2px 0;"><b>より自然な表現：</b> ${w.example.replace("___", w.w)}</div>
            <div style="margin:2px 0;"><b>ポイント：</b> ${r.spellingMiss ? `スペルミス：「${escapeHtml(r.spellingMiss.typed)}」→「${escapeHtml(r.spellingMiss.expected)}」` : `「${w.w}」という単語が文中で使われていません。`}</div>
          </div>`;
      } else {
        feedbackHtml = `
          <div style="margin:10px 0;font-size:13px;color:var(--good);font-weight:600;">✅ 「${w.w}」を使えています。</div>
        ` + renderEvalCard(r) + (passed ? "" : `
          <div style="margin-top:8px;font-size:12.5px;color:var(--muted);">※ 単語の使用と文法は正しいので正解扱いですが、より自然な表現もあわせて確認しよう。</div>
        `);
        if (!r.grammarCorrect) {
          feedbackHtml = `
            <div style="margin:10px 0;font-size:13px;color:var(--bad);font-weight:600;">❌ 不正解（文法エラーあり）</div>
          ` + renderEvalCard(r);
        }
      }
      document.getElementById("produceEvalArea").innerHTML = feedbackHtml + pronHtml(w);
      document.getElementById("vocabNext").addEventListener("click", () => {
        gradeAndContinue(passed, 0);
      });
    } else {
      const ta = document.getElementById("vocabSentence");
      ta.addEventListener("input", () => { s.draftText = ta.value; });
      document.getElementById("vocabProduceCheck").addEventListener("click", async () => {
        const text = ta.value.trim();
        if (!text || s.busy) return;
        if (englishWordCount(text) < 3) {
          s.draftText = text; s.inputWarning = "3語以上の英文で書いてみよう（採点はしていません）。"; render();
          return;
        }
        s.inputWarning = null;
        s.busy = true;
        s.draftText = text;
        render();

        // Deterministic gate FIRST: correctness is never decided by the AI's semantic judgment.
        const localWordUsed = containsTargetWord(text, w);
        let result;
        if (!localWordUsed) {
          result = {
            wordUsed: false, grammarCorrect: true, grammarNote: "", naturalness: "natural", naturalNote: "",
            better: w.example.replace("___", w.w), betterIsCorrection: false, points: [],
            issueFound: true, issueCategory: "word-usage", mistakeType: "word-usage", importance: "medium",
            reviewPromptJp: w.jp, spellingMiss: findSpellingNearMiss(text, w)
          };
        } else {
          const sample = await getSample();
          if (!sample) {
            result = fallbackVocabEval(w, text);
          } else {
            try { result = await sample.json(buildVocabProducePrompt(w, text)); }
            catch (e) { console.warn("vocab sample failed", e); result = fallbackVocabEval(w, text); }
          }
          result.wordUsed = true; // deterministic check already confirmed this — don't let the AI flip it
        }
        s.busy = false;
        s.evalResult = result;
        if (result.issueFound) {
          // 復習では「単語」として出題されるので、添削後の文ではなく単語そのものを登録する。
          // 添削後の文は「覚えておくポイント」に残す。
          const pointText = (result.points && result.points[0]) || result.grammarNote || result.naturalNote || "";
          addSrsItem({
            jp: w.jp,
            en: w.w,
            type: "vocab",
            mistakeType: result.mistakeType || "phrasing",
            importance: result.importance || "medium",
            note: [pointText, result.better ? `例：${result.better}` : ""].filter(Boolean).join(" ")
          });
        }
        render();
      });
    }
    return;
  }

  function bindBack() {
    document.getElementById("backHome").addEventListener("click", () => go("home"));
  }

  // verdict: "correct" | "close" | "incorrect" (produce type passes a boolean for backward compat)
  function gradeAndContinue(verdict, delay) {
    const isCorrect = verdict === "correct" || verdict === true;
    state.vocabTotal += 1;
    if (isCorrect) {
      s.correctCount += 1; state.vocabCorrect += 1;
    } else if (it.type !== "produce") {
      // "close" (△) and "incorrect" (❌) are both treated as not-yet-mastered for SRS purposes.
      addSrsItem({ jp: w.jp, en: w.w, type: "vocab", mistakeType: it.type, importance: verdict === "close" ? "low" : "medium", note: s.lastNote || "" });
    }
    saveState();
    setTimeout(() => {
      s.idx += 1;
      s.answered = false;
      s.revealed = false;
      s.checking = false;
      s.lastNatural = null;
      s.lastNote = null;
      s.evalResult = null;
      s.draftText = "";
      s.inputWarning = null;
      s.busy = false;
      if (s.idx >= s.items.length) {
        s.finished = true;
        markDoneToday("vocab");
      }
      render();
    }, delay);
  }
}

// Builds the instruction for a vocab "make your own sentence" check — reuses the same JSON shape as the conversation coach.
function buildVocabProducePrompt(word, sentence) {
  return `You are an English coach for Etsu, a Japanese university runner (5000m PB 14:11, goal 13:30) preparing to train with a university team in Canada (like UTTC). He studies English 15 min/day, upper-beginner to intermediate ESL.

Target vocabulary word: "${word.w}" (${word.jp}), typically used in a ${word.category || "running"} context.
Etsu wrote this sentence trying to use the word naturally: "${sentence}"

First check whether the sentence actually uses "${word.w}" or a natural inflected form of it (plural, -ing, -ed, etc.). Then evaluate grammar and naturalness as SEPARATE, NON-OVERLAPPING dimensions — a grammatically valid sentence is NOT a grammar error just because a more idiomatic phrasing exists. Two independent clauses fused with no period/conjunction (a run-on) IS a real grammar issue, not a stylistic nitpick. Treat standard SPOKEN running/track & field terminology (e.g. "pace run", "tempo run", "PB", "splits", "reps") as normal and correct — but raw numeral shorthand written inline as if it were a sentence (e.g. "1000*5", "5x1000") is NEVER natural on its own, even in this context; it must be spelled out in words for "better" (e.g. "five 1,000-meter intervals"). If naturalness is not "natural", "better" MUST be substantively different from the original — never echo it unchanged.

Reply with STRICT JSON only, no markdown fences, matching exactly this shape:
{
 "wordUsed": boolean (true only if the target word or a natural inflected form actually appears, used with roughly the right meaning),
 "grammarCorrect": boolean,
 "grammarNote": "if grammarCorrect is false, a short JAPANESE explanation (plain language, no English grammar jargon) of the error; else empty string",
 "naturalness": "one of: natural | more_natural_available | unnatural",
 "naturalNote": "a short JAPANESE note (plain language) from a native runner's perspective; empty string if already natural",
 "better": "a natural native-speaker version of the sentence, still using the target word",
 "betterJp": "a short, natural Japanese translation of \"better\" (so Etsu can instantly check the meaning)",
 "betterIsCorrection": boolean (true only if fixing a real grammar error),
 "points": ["at most 2 short Japanese notes, one sentence each"],
 "issueFound": boolean (true if there is a real grammar error, the word wasn't used, or a naturalness point worth reviewing),
 "issueCategory": "one of: grammar | naturalness | word-usage | none",
 "mistakeType": "one of: tense, preposition, article, word-choice, word-order, phrasing, word-usage, other",
 "importance": "one of: high, medium, low",
 "reviewPromptJp": "a short Japanese sentence Etsu could translate back to English later to drill this exact word/fix"
}
Keep all English fields short.`;
}

// Offline fallback if the sample capability is unavailable.
function fallbackVocabEval(word, sentence) {
  const norm = normalizeWord(sentence);
  const root = normalizeWord(word.w).slice(0, Math.min(4, normalizeWord(word.w).length));
  const wordUsed = root.length > 0 && norm.includes(root);
  const hasCapital = /^[A-Z]/.test(sentence.trim());
  const hasPunct = /[.!?]$/.test(sentence.trim());
  const grammarIssue = !hasCapital || !hasPunct;
  return {
    wordUsed,
    grammarCorrect: !grammarIssue,
    grammarNote: grammarIssue ? "文の始まりと終わりを確認しよう" : "",
    naturalness: grammarIssue ? "unnatural" : "natural",
    naturalNote: "",
    better: sentence,
    betterIsCorrection: grammarIssue,
    points: !wordUsed ? [`「${word.w}」を使ってみよう。`] : (grammarIssue ? ["大文字と句読点を確認しよう。"] : []),
    issueFound: !wordUsed || grammarIssue,
    issueCategory: !wordUsed ? "word-usage" : (grammarIssue ? "grammar" : "none"),
    mistakeType: !wordUsed ? "word-usage" : "other",
    importance: "low",
    reviewPromptJp: word.jp
  };
}

/* ---- CONVERSATION (AI coach via sample capability) ---- */
// Talks to our own Netlify function (netlify/functions/ask.js), which holds the real Anthropic
// API key server-side and never exposes it to the browser. Same .json(prompt) interface as
// before, so every call site elsewhere in this file needs no change at all.
function getSample() {
  return Promise.resolve({
    json: async (prompt) => {
      const res = await fetch("/.netlify/functions/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      });
      if (!res.ok) {
        const text = await res.text().catch(() => "");
        throw new Error("AI request failed (" + res.status + "): " + text);
      }
      return await res.json();
    }
  });
}

function renderConversation() {
  if (!convoSession) {
    main.innerHTML = `
      <div class="screen-head">
        <div class="backbtn" id="backHome">←</div>
        <div class="screen-title">会話<span class="sec">テーマを選ぶ</span></div>
      </div>
      <div class="themegrid">
        ${CONVERSATIONS.map(c => `
          <div class="themebtn" data-id="${c.id}">
            <div>
              ${c.title}
              <div class="jp">${c.jp}</div>
            </div>
            <div class="arrow">→</div>
          </div>`).join("")}
      </div>
    `;
    document.getElementById("backHome").addEventListener("click", () => go("home"));
    main.querySelectorAll(".themebtn").forEach(el => {
      el.addEventListener("click", () => {
        const convo = CONVERSATIONS.find(c => c.id === el.dataset.id);
        convoSession = {
          convo,
          thread: [{ from: "npc", who: convo.who, text: convo.prompt }],
          turn: 0,
          targetTurns: 3 + Math.floor(Math.random() * 3), // 3–5 turns
          loggedItems: [],
          busy: false,
          finished: false,
          npcShownAt: Date.now(),   // 返答タイマー：相手のセリフが表示された時刻
          replyTimes: [],
          hintCount: 0,
          hintResult: null, hintBusy: false,
          draftText: ""
        };
        renderConversation();
      });
    });
    return;
  }

  const s = convoSession;

  if (s.finished) {
    renderConvoSummary(s);
    return;
  }

  main.innerHTML = `
    <div class="screen-head">
      <div class="backbtn" id="backList">←</div>
      <div class="screen-title">会話<span class="sec">${s.convo.jp} · ターン ${s.turn + 1} / ${s.targetTurns}</span></div>
    </div>
    <div id="thread"></div>
    <div id="wordLookupArea"></div>
    <div id="hintArea"></div>
    <div class="toolrow">
      <button class="cta secondary" id="hintBtn" ${s.busy || s.hintBusy ? "disabled" : ""}>💡 ヒント${s.hintCount ? `（${s.hintCount}回）` : ""}</button>
      ${speechRecognitionAvailable() ? `<button class="cta secondary" id="micBtn" ${s.busy ? "disabled" : ""}>🎤 声で入力</button>` : ""}
    </div>
    <textarea class="answer" id="userAns" placeholder="英語で返信してください…" ${s.busy ? "disabled" : ""}>${escapeHtml(s.draftText || "")}</textarea>
    <button class="cta" id="submitAns" ${s.busy ? "disabled" : ""} style="width:100%;">${s.busy ? "確認中…" : "送信"}</button>
  `;
  document.getElementById("backList").addEventListener("click", () => { convoSession = null; renderConversation(); });

  const threadEl = document.getElementById("thread");
  s.liveJp = s.liveJp || {}; s.liveShown = s.liveShown || {};
  s.thread.forEach((item, idx) => {
    if (item.from === "npc") {
      threadEl.insertAdjacentHTML("beforeend", `
        <div class="bubble npc"><div class="who">${item.who} <span class="speakbtn" data-speak="${escapeHtml(item.text)}">🔊</span></div>${wrapTappableWords(item.text)}</div>`);
    } else if (item.from === "me") {
      threadEl.insertAdjacentHTML("beforeend", `
        <div class="bubble me"><div class="who">You</div>${escapeHtml(item.text)}${item.secs != null ? `<div class="replytime">⏱ 返答まで ${item.secs}秒</div>` : ""}</div>`);
    } else if (item.from === "eval") {
      threadEl.insertAdjacentHTML("beforeend", renderEvalCard(item.data));
    }
  });
  threadEl.scrollIntoView({ block: "end" });
  threadEl.addEventListener("click", (e) => {
    const el = e.target.closest(".tapword");
    if (!el || s.wordLookupBusy) return;
    const bubbleEl = el.closest(".bubble");
    const contextText = bubbleEl ? bubbleEl.textContent.replace(/^\s*\S+\s*/, "") : ""; // drop the "who" label
    lookupUnknownWord(el.dataset.word, contextText, s);
  });
  renderWordLookupArea(s);
  renderHintArea(s);

  const ansEl = document.getElementById("userAns");
  ansEl.addEventListener("input", () => { s.draftText = ansEl.value; });
  document.getElementById("submitAns").addEventListener("click", () => handleSend());
  document.getElementById("hintBtn").addEventListener("click", () => requestHint(s));
  const micBtn = document.getElementById("micBtn");
  if (micBtn) micBtn.addEventListener("click", () => toggleMic(s, ansEl, micBtn));
  ansEl.focus();

  async function handleSend() {
    const ta = document.getElementById("userAns");
    const text = ta.value.trim();
    if (!text || s.busy) return;
    // 日本語や2語未満の入力はターンを消費せず、AIも呼ばずに差し戻す。
    if (containsJapanese(text) || englishWordCount(text) < 2) {
      const hint = document.getElementById("hintArea");
      if (hint) hint.innerHTML = `<div class="correctbox" style="margin-bottom:8px;color:var(--accent);font-weight:600;">⚠️ 英語で2語以上書いてみよう。詰まったら💡ヒントを使おう（ターンは消費していません）。</div>`;
      return;
    }
    stopMic(s);
    s.busy = true;
    const secs = Math.max(0, Math.round((Date.now() - (s.npcShownAt || Date.now())) / 1000));
    s.replyTimes.push(secs);
    s.draftText = ""; s.hintResult = null;
    s.thread.push({ from: "me", text, secs });
    const isFinalTurn = (s.turn + 1) >= s.targetTurns;
    renderConversation();
    document.getElementById("thread").insertAdjacentHTML("beforeend", `<div class="bubble npc thinking" id="thinkingBubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`);

    const sample = await getSample();
    let result;
    if (!sample) {
      result = fallbackEval(text, s.convo, isFinalTurn);
    } else {
      try {
        result = await sample.json(buildCoachPrompt(s.convo, s.thread, text, isFinalTurn));
      } catch (e) {
        console.warn("sample call failed", e);
        result = fallbackEval(text, s.convo, isFinalTurn);
      }
    }
    const think = document.getElementById("thinkingBubble");
    if (think) think.remove();

    s.thread.push({ from: "eval", data: result });
    if (result.coachNext) {
      s.thread.push({ from: "npc", who: s.convo.who, text: result.coachNext });
    }
    s.npcShownAt = Date.now();
    if (result.issueFound) {
      s.loggedItems.push({
        point: (result.points && result.points[0]) || "",
        better: result.better || "",
        betterJp: result.betterJp || "",
        mistakeType: result.mistakeType || "other",
        importance: result.importance || "medium",
        category: result.issueCategory || (result.grammarCorrect === false ? "grammar" : "naturalness"),
        expression: result.expression || "",
        expressionJp: result.expressionJp || "",
        userOriginal: text,
        reviewPromptJp: result.reviewPromptJp || s.convo.jp
      });
    }
    s.turn += 1;
    s.busy = false;
    if (isFinalTurn) {
      s.finished = true;
      state.hintTotal = (state.hintTotal || 0) + (s.hintCount || 0);
      state.transTotal = (state.transTotal || 0) + (s.transCount || 0);
      state.replyTimeLog = [...(state.replyTimeLog || []), ...s.replyTimes].slice(-100);
      saveState();
      commitConversationExpressions(s);
      markDoneToday("conversation"); // fires as soon as the session is actually complete
    }
    renderConversation();
  }
}

/* ---- HINT: 全訳は出さず、使えるキーワードの断片だけを出す ---- */
function buildHintPrompt(convo, npcLine, draft) {
  return `You are helping a Japanese ESL runner who is stuck replying in an English conversation (scenario: ${convo.title}).
The other person just said: "${npcLine}"
${draft ? `His unfinished reply so far: "${draft}"` : "He has not written anything yet."}

Give ONLY 2-4 short English keyword fragments (1-3 words each) he could use in his reply. NEVER give a full sentence or a full translation.
Also give one short Japanese cue (under 25 characters) about what to talk about.

Reply with STRICT JSON only, no markdown fences:
{"keywords": ["fragment", "fragment"], "cueJp": "短い日本語のヒント"}`;
}
async function requestHint(s) {
  if (s.hintBusy || s.busy) return;
  const lastNpc = [...s.thread].reverse().find(t => t.from === "npc");
  s.hintBusy = true; s.hintResult = null; renderHintArea(s);
  const btn = document.getElementById("hintBtn"); if (btn) btn.disabled = true;
  let res = null;
  try {
    const sample = await getSample();
    res = await sample.json(buildHintPrompt(s.convo, lastNpc ? lastNpc.text : "", s.draftText || ""));
  } catch (e) { console.warn("hint failed", e); }
  s.hintBusy = false;
  if (res && Array.isArray(res.keywords) && res.keywords.length) {
    s.hintCount += 1;
    s.hintResult = { keywords: res.keywords.slice(0, 4), cueJp: res.cueJp || "" };
  } else {
    s.hintResult = { error: true };
  }
  renderHintArea(s);
  if (btn) { btn.disabled = false; btn.textContent = `💡 ヒント（${s.hintCount}回）`; }
}
function renderHintArea(s) {
  const el = document.getElementById("hintArea");
  if (!el) return;
  if (s.hintBusy) { el.innerHTML = `<div class="correctbox" style="margin-bottom:8px;">ヒントを考えています…</div>`; return; }
  const r = s.hintResult;
  if (!r) { el.innerHTML = ""; return; }
  if (r.error) { el.innerHTML = `<div class="correctbox" style="margin-bottom:8px;color:var(--muted);">ヒントを取得できませんでした。もう一度押してみて。</div>`; return; }
  el.innerHTML = `<div class="correctbox" style="margin-bottom:8px;">
    <div class="lbl">💡 使えそうな言葉</div>
    ${r.keywords.map(k => `<span class="pill medium" style="margin:2px 4px 2px 0;">${escapeHtml(k)}</span>`).join("")}
    ${r.cueJp ? `<div style="margin-top:6px;font-size:12.5px;color:var(--muted);">${escapeHtml(r.cueJp)}</div>` : ""}
  </div>`;
}

/* ---- MIC: 声で入力（認識結果はテキスト欄に入るので、送信前に確認・修正できる） ---- */
let activeRecognition = null;
function stopMic(s) {
  if (activeRecognition) { try { activeRecognition.stop(); } catch (e) {} activeRecognition = null; }
  if (s) s.listening = false;
}
function toggleMic(s, ansEl, btn) {
  if (s.listening) { stopMic(s); btn.textContent = "🎤 声で入力"; return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  const rec = new SR();
  rec.lang = "en-US";
  rec.interimResults = true;
  rec.continuous = false;
  const base = ansEl.value ? ansEl.value.replace(/\s*$/, " ") : "";
  rec.onresult = (ev) => {
    let t = "";
    for (let i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript;
    ansEl.value = base + t;
    s.draftText = ansEl.value;
  };
  rec.onerror = (ev) => {
    console.warn("speech error", ev.error);
    btn.textContent = ev.error === "not-allowed" ? "🎤 マイクが許可されていません" : "🎤 聞き取れませんでした";
  };
  rec.onend = () => {
    s.listening = false; activeRecognition = null;
    if (/聞いています/.test(btn.textContent)) btn.textContent = "🎤 声で入力";
  };
  try {
    rec.start();
    activeRecognition = rec; s.listening = true;
    btn.textContent = "⏹ 聞いています…（タップで停止）";
  } catch (e) { console.warn("speech start failed", e); }
}

/* ---- 会話後のまとめ：相手のセリフの日本語訳（会話中は出さない） ---- */
function buildNpcTranslatePrompt(lines) {
  return `Translate each English line into natural, casual Japanese. Keep the same order and count.
Lines:
${lines.map((l, i) => `${i + 1}. ${l}`).join("\n")}

Reply with STRICT JSON only, no markdown fences: {"jp": ["訳1", "訳2"]}`;
}
// 会話中の訳：タップした時だけ表示し、使った回数を記録する（ヒントと同じく後で振り返る用）。
async function toggleLiveTranslation(s, idx) {
  const item = s.thread[idx];
  if (!item || item.from !== "npc") return;
  if (s.liveShown[idx]) { s.liveShown[idx] = false; renderConversation(); return; }
  s.liveShown[idx] = true;
  s.transCount = (s.transCount || 0) + 1;
  if (s.liveJp[idx] !== undefined) { renderConversation(); return; }
  renderConversation();
  let jp = "";
  try {
    const sample = await getSample();
    const res = await sample.json(buildNpcTranslatePrompt([item.text]));
    jp = (res && Array.isArray(res.jp) && res.jp[0]) || "";
  } catch (e) { console.warn("live translate failed", e); }
  s.liveJp[idx] = jp;
  if (convoSession === s && !s.finished) renderConversation();
}

async function loadNpcTranslations(s) {
  if (s.npcJp || s.npcJpBusy) return;
  const lines = s.thread.filter(t => t.from === "npc").map(t => t.text);
  if (!lines.length) return;
  s.npcJpBusy = true;
  try {
    const sample = await getSample();
    const res = await sample.json(buildNpcTranslatePrompt(lines));
    s.npcJp = (res && Array.isArray(res.jp)) ? res.jp : [];
  } catch (e) { console.warn("translate failed", e); s.npcJp = []; }
  s.npcJpBusy = false;
  if (convoSession === s && currentTab === "conversation") renderConversation();
}

// Called once, at the end of a session: picks at most the top 2-3 issues by importance
// (skipping low-importance/trivial ones and anything with no extractable reusable expression)
// and registers ONLY those as Conversation Expression SRS items — not every single correction.
function commitConversationExpressions(s) {
  const rank = { high: 0, medium: 1, low: 2 };
  const candidates = s.loggedItems
    .filter(it => it.expression && it.importance !== "low")
    .sort((a, b) => (rank[a.importance] ?? 1) - (rank[b.importance] ?? 1));
  const chosen = candidates.slice(0, 3);
  chosen.forEach(it => {
    addExpressionSrsItem({
      expression: it.expression,
      expressionJp: it.expressionJp || it.reviewPromptJp,
      userOriginal: it.userOriginal,
      natural: it.better,
      category: s.convo.category || s.convo.title,
      importance: it.importance,
      mistakeType: it.mistakeType,
      note: it.point || ""
    });
    it.saved = true;
  });
}
