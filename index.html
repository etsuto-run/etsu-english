function renderRecallFeedback(it, w, s) {
  const verdict = s.lastVerdict;

  if (it.type === "en2jp") {
    const correctAnswer = w.jp;
    const altText = (w.alternatives && w.alternatives.length) ? w.alternatives.join(" / ") : "—";
    if (verdict === "correct") {
      return `
        <div class="correctbox">
          <div class="lbl">✅ 正解</div>${correctAnswer}
        </div>`;
    }
    if (verdict === "close") {
      return `
        <div class="correctbox" style="background:rgba(232,90,42,0.1);border-color:var(--accent);">
          <div class="lbl" style="color:var(--accent);">△ 惜しい</div>
          <div style="margin:6px 0 2px;"><b>あなたの回答：</b> ${escapeHtml(s.lastInput || "（空欄）")}</div>
          <div style="margin:2px 0;"><b>正確な意味：</b> ${correctAnswer}</div>
          <div style="margin:2px 0;"><b>より自然な表現：</b> ${altText}</div>
          <div style="margin:2px 0;"><b>ポイント：</b> 方向性は合っているが、正確な意味とはズレがある。「${correctAnswer}」で覚え直そう。</div>
        </div>`;
    }
    return `
      <div class="correctbox" style="background:rgba(248,113,113,0.1);border-color:var(--bad);">
        <div class="lbl" style="color:var(--bad);">❌ 不正解</div>
        <div style="margin:6px 0 2px;"><b>あなたの回答：</b> ${escapeHtml(s.lastInput || "（空欄）")}</div>
        <div style="margin:2px 0;"><b>正解：</b> ${correctAnswer}</div>
        <div style="margin:2px 0;"><b>より自然な表現：</b> ${altText}</div>
        <div style="margin:2px 0;"><b>ポイント：</b> 日本語の意味を正確に思い出そう。</div>
      </div>`;
  }

  // jp2en / cloze: semantic classification, so the "correct" bucket may cover valid synonyms
  // the registered answer/accepted list doesn't literally contain (e.g. "foodstuffs" for groceries).
  const referenceAnswer = w.w;
  const natural = s.lastNatural || referenceAnswer;
  const showNatural = normalizeWord(natural) !== normalizeWord(s.lastInput || "");
  const jpMeaningLine = it.type === "cloze" ? `<div style="margin-top:6px;"><b>意味：</b> ${w.jp}</div>` : "";
  const sentenceJpLine = (it.type === "cloze" && w.exampleJp) ? `<div style="margin-top:2px;"><b>例文の訳：</b> ${w.exampleJp}</div>` : "";

  if (verdict === "correct") {
    return `
      <div class="correctbox">
        <div class="lbl">✅ 正解</div>
        「${escapeHtml(s.lastInput || "")}」は意味として正しいです。
        ${showNatural ? `<div style="margin-top:6px;"><b>より自然・一般的な表現：</b> ${natural}</div>` : ""}
        ${jpMeaningLine}${sentenceJpLine}
      </div>`;
  }
  if (verdict === "close") {
    return `
      <div class="correctbox" style="background:rgba(232,90,42,0.1);border-color:var(--accent);">
        <div class="lbl" style="color:var(--accent);">△ 惜しい</div>
        <div style="margin:6px 0 2px;"><b>あなたの回答：</b> ${escapeHtml(s.lastInput || "（空欄）")}</div>
        <div style="margin:2px 0;"><b>より自然な表現：</b> ${natural}</div>
        <div style="margin:2px 0;"><b>ポイント：</b> ${s.lastNote || "意味は近いが、この文脈での代表的な表現としては少しずれている。"}</div>
        ${jpMeaningLine}${sentenceJpLine}
      </div>`;
  }
  return `
    <div class="correctbox" style="background:rgba(248,113,113,0.1);border-color:var(--bad);">
      <div class="lbl" style="color:var(--bad);">❌ 不正解</div>
      <div style="margin:6px 0 2px;"><b>あなたの回答：</b> ${escapeHtml(s.lastInput || "（空欄）")}</div>
      <div style="margin:2px 0;"><b>正解例：</b> ${referenceAnswer}</div>
      <div style="margin:2px 0;"><b>より自然な表現：</b> ${natural}</div>
      <div style="margin:2px 0;"><b>ポイント：</b> ${s.lastNote || (w.accepted && w.accepted.length ? `スペルを確認しよう（${w.accepted.join(" / ")} も可）。` : "スペルを確認しよう。")}</div>
      ${jpMeaningLine}${sentenceJpLine}
    </div>`;
}

function renderEvalCard(d) {
  // 判定がない項目（AIが使えなかった等）は「OK」と偽らず、行ごと表示しない。
  const hasGrammar = typeof d.grammarCorrect === "boolean";
  const hasNatural = !!d.naturalness;
  const grammarPill = d.grammarCorrect
    ? `<span class="pill ok">文法OK</span>`
    : `<span class="pill issue">文法ミス</span>`;
  const naturalPill = d.naturalness === "natural"
    ? `<span class="pill ok">自然</span>`
    : d.naturalness === "unnatural"
      ? `<span class="pill issue">不自然</span>`
      : `<span class="pill medium">より自然な表現あり</span>`;
  return `
    <div class="evalcard">
      ${hasGrammar ? `<div class="row"><div class="k">文法</div><div>${d.grammarNote || (d.grammarCorrect ? "文法的な誤りはありません。" : "")}${grammarPill}</div></div>` : ""}
      ${hasNatural ? `<div class="row"><div class="k">自然さ</div><div>${d.naturalNote || ""}${naturalPill}</div></div>` : ""}
      ${d.better ? `<div class="row better"><div class="k">より自然な英語</div><div>${d.better}</div></div>` : ""}
      ${(d.points && d.points.length) ? `<div class="row point"><div class="k">ポイント</div><div>${d.points.join(" / ")}</div></div>` : ""}
      ${d.better && d.betterJp ? `<div class="row"><div class="k">意味</div><div style="color:var(--muted);">${escapeHtml(d.betterJp)}</div></div>` : ""}
    </div>`;
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Builds the instruction sent to sample.json — asks for a compact JSON coaching object.
function buildCoachPrompt(convo, thread, latestReply, isFinalTurn) {
  const history = thread
    .filter(t => t.from === "npc" || t.from === "me")
    .map(t => (t.from === "npc" ? "Coach/Teammate: " + t.text : "Etsu: " + t.text))
    .join("\n");
  return `You are an English conversation coach roleplaying as a teammate/coach for Etsu, a Japanese university runner (5000m PB 14:11, goal 13:30) about to train with a university running team in Canada (like UTTC). He studies English 15 min/day. His level is upper-beginner to intermediate ESL.

Scenario category: ${convo.category || convo.title} (${convo.jp}).
Conversation so far:
${history}

Etsu's latest reply to evaluate: "${latestReply}"

Evaluate ONLY Etsu's latest reply, following this priority order:
1. PRESERVE MEANING — the corrected sentence must express exactly, and only, the information Etsu actually stated. Never add distances, paces, times, feelings/opinions ("it was hard"), training details, or any other fact he did not say. Never guess or invent specifics he left out.
2. Fix grammar — tense, articles, prepositions, word order, agreement, AND sentence boundaries (see run-on rule below).
3. Fix unnatural word choice / collocations — e.g. "trained 1000×5 of intervals" is grammatically parseable but is not how a native runner phrases it; the fix is a natural collocation for the SAME content ("did five 1,000-meter intervals"), not a different sentence.
4. Offer a more natural native-runner phrasing, still carrying only Etsu's original content.
5. If the conversation would naturally want more detail (how it felt, the pace, etc.), do NOT invent it — ask for it in "coachNext" instead.

You MUST evaluate grammar and naturalness as two SEPARATE, NON-OVERLAPPING dimensions — do not call something a grammar mistake just because a more idiomatic phrasing exists, and do not treat "grammar" as only capitalization/punctuation.

- Grammar = is the sentence grammatically well-formed (tense, articles, prepositions, word order, agreement, sentence boundaries)? If it is grammatically valid — even if the wording or collocation is awkward — grammarCorrect MUST be true.
- RUN-ON RULE: if Etsu writes two independent clauses with no period/conjunction/semicolon between them (e.g. "...intervals It was very hard" — two complete sentences fused with no break), this IS a real grammar problem, not a stylistic nitpick — grammarCorrect: false, mistakeType: "phrasing" or "other", grammarNote explaining a sentence break is needed. This is different from trivial capitalization-only issues, which still do not count as grammar errors on their own.
- Naturalness = independent of grammar, and this is where awkward collocations / word choice belong (e.g. "trained 1000×5 of intervals" → grammarCorrect: true, naturalness: "more_natural_available", NOT a grammar error).
- NUMERIC SHORTHAND RULE: training-log shorthand written inline as if it were spoken English — e.g. "1000*5", "5x1000", "3x1km" — is NEVER "natural" on its own, even in a running/track & field context, no matter how standard it is as a coach's written note. It must always get naturalness: "more_natural_available" (or "unnatural"), with "better" spelling it out in words a runner would actually SAY out loud (e.g. "five 1,000-meter intervals", "three one-kilometer reps"). Do not confuse this with genuine spoken running vocabulary/idioms (e.g. "pace run", "tempo run", "PB", "splits", "reps", "easy day", "long run", "threshold", "warm-up", "cool-down"), which ARE natural as-is — the rule applies specifically to raw numeral+operator notation, not to running terminology itself.
- Running / track & field context matters. For ANY running/training expression Etsu uses, decide which of these three cases applies, and never collapse them into one verdict:
  1. Grammatically wrong (e.g. missing article, wrong tense, a run-on per the rule above) → grammarCorrect: false.
  2. Grammatically fine AND standard, accepted SPOKEN terminology in a running/track & field context (see the list above) → grammarCorrect: true, naturalness: "natural". Do NOT suggest a "better" alternative just because it differs from everyday non-running English — this is correct as-is.
  3. Grammatically fine but phrased in an unnatural or overly literal way (including awkward collocations and numeric shorthand) → grammarCorrect: true, naturalness: "more_natural_available", with a genuinely more idiomatic suggestion in "better" that preserves the exact same content.
- HARD RULE: if naturalness is "more_natural_available" or "unnatural", "better" MUST be a substantively rewritten sentence — it must NOT equal, or nearly equal, Etsu's original wording. Returning the original unchanged is only allowed when naturalness is "natural".
- Avoid absolute claims like "a native would never say this" — frame naturalness notes as "in this running context, X is more natural" or "runners more commonly say X here", not as a hard rule of English.

Reply with STRICT JSON only, no markdown fences, matching exactly this shape:
{
 "grammarCorrect": boolean,
 "grammarNote": "if grammarCorrect is false, a short JAPANESE explanation (one sentence, plain language, no English grammar jargon like 'subject-verb agreement') of the actual grammar error and how to fix it. If grammarCorrect is true, leave this empty string.",
 "naturalness": "one of: natural | more_natural_available | unnatural",
 "naturalNote": "a short JAPANESE note (one sentence, plain language) from a native runner's perspective describing the actual issue — empty string if naturalness is 'natural'",
 "meaningClear": boolean,
 "better": "a natural native-speaker phrasing of EXACTLY what Etsu said — same facts, same content, nothing added and nothing removed. If grammarCorrect is true and naturalness is 'natural', this can equal or lightly polish the original.",
 "betterJp": "a short, natural Japanese translation of \"better\" (so Etsu can instantly check the meaning)",
 "betterIsCorrection": boolean (true only if this fixes an actual grammar error; false if it's just a more natural/idiomatic alternative to an already-correct sentence),
 "points": ["at most 3 short Japanese notes, each ONE short sentence, each clearly a grammar note or a naturalness note — do not mix them into one line"],
 "issueFound": boolean (true if there is a real grammar error OR a naturalness alternative worth logging for review; false if the sentence is both grammatically correct and already natural),
 "issueCategory": "one of: grammar | naturalness | none",
 "mistakeType": "one of: tense, preposition, article, word-choice, word-order, collocation, phrasing, other",
 "importance": "one of: high, medium, low — how much this would confuse a native listener or stand out as non-native",
 "reviewPromptJp": "a short Japanese sentence Etsu could later translate back to English to drill this exact fix",
 "expression": "ONLY if issueFound is true: the core reusable phrase from \"better\" that Etsu could reuse in other sentences — a short natural-English fragment in base/dictionary form (e.g. \"do five 1,000-meter intervals\", not the whole sentence, and not just a single word already covered by vocabulary study). Empty string if there's nothing worth extracting as a reusable phrase.",
 "expressionJp": "short Japanese meaning of that expression phrase alone (empty string if expression is empty)",
 "coachNext": "${isFinalTurn
   ? "a short, natural CLOSING remark from the coach/teammate that wraps up this chat — NOT a new question, 1 sentence"
   : "the next natural question or line the coach/teammate would say, continuing the SAME topic and staying within the scenario category, 1 sentence. If Etsu's reply left out a natural detail (how it felt, the pace, etc.), ask for it here rather than assuming it in \"better\"."}"
}
Keep all English fields short. Keep "points" minimal — do not add a point if grammarCorrect is true and naturalness is 'natural'.`;
}

// Used only if the sample capability is unavailable (offline fallback), so the app still works end to end.
// Critical: this must NEVER substitute a different, pre-written sentence for "better" — that was
// exactly the bug (a scripted scenario example replacing what Etsu actually said). It only performs
// a light, content-preserving cleanup (capitalization / trailing punctuation) of Etsu's own text, and
// does not claim to judge grammar or naturalness beyond that, since it can't reliably do so without AI.
function lightCleanup(text) {
  let t = text.trim();
  if (!t) return t;
  t = t.charAt(0).toUpperCase() + t.slice(1);
  if (!/[.!?]$/.test(t)) t += ".";
  return t;
}
function fallbackEval(text, convo, isFinalTurn) {
  const trimmed = text.trim();
  const formattingIssue = !/^[A-Z]/.test(trimmed) || !/[.!?]$/.test(trimmed);
  return {
    grammarCorrect: true,
    grammarNote: "",
    naturalness: "natural",
    naturalNote: "",
    meaningClear: true,
    better: lightCleanup(trimmed),
    betterIsCorrection: false,
    points: formattingIssue ? ["文の最初は大文字に、最後は句読点をつけよう。"] : [],
    issueFound: formattingIssue,
    issueCategory: formattingIssue ? "naturalness" : "none",
    mistakeType: "other",
    importance: "low",
    reviewPromptJp: convo.jp,
    expression: "",
    expressionJp: "",
    coachNext: isFinalTurn ? "Nice talking with you — see you at practice!" : "Got it — tell me more about that."
  };
}

/* ---- REVIEW (SRS: due-today items, both vocab and Conversation Expression) ---- */
// Adapts any SRS item (vocab or expression) into the {w, jp, accepted, ...} shape the
// classify functions already understand, so Review reuses the exact same judging engine.
function findWordBankEntry(en) {
  const key = normalizeWord(en);
  return WORD_BANK.find(w => normalizeWord(w.w) === key);
}

// Wraps each word of NPC dialogue in a tappable span, so Etsu can tap a word he doesn't know —
// including one the NPC used, not just his own mistakes — and add it straight to SRS.
function wrapTappableWords(text) {
  return text.split(/(\s+)/).map(tok => {
    if (!tok || /^\s+$/.test(tok)) return tok;
    const clean = tok.replace(/^[^a-zA-Z']+|[^a-zA-Z']+$/g, "");
    if (!clean) return escapeHtml(tok);
    return `<span class="tapword" data-word="${escapeHtml(clean)}">${escapeHtml(tok)}</span>`;
  }).join("");
}

function buildWordLookupPrompt(word, contextSentence) {
  return `You are a compact Japanese-English dictionary helping a Japanese university student (a competitive runner) understand a word he just read in an English practice conversation about running, university life, or moving to Canada.

He tapped this word/phrase because he doesn't know it: "${word}"
${contextSentence ? `It appeared in this sentence: "${contextSentence}"` : ""}

Give ONLY the meaning as used in this specific context (not a full dictionary entry). Keep it short and practical for a Japanese learner.

Reply with STRICT JSON only, no markdown fences:
{
 "jp": "short Japanese meaning as used here (a word or short phrase, not a full sentence)",
 "pos": "short Japanese part-of-speech label, e.g. 動詞 / 名詞 / 形容詞 / 副詞",
 "note": "one short Japanese sentence with a usage nuance or tip, or empty string if not needed",
 "ipa": "General American IPA without slashes, with ˈ stress marks",
 "kana": "katakana approximation, wrapping the stressed part in [ ] (e.g. リ[カ]バリー)"
}`;
}

// Looks up a tapped word: checks the local WORD_BANK first (instant, no API call), then falls
// back to the AI for anything not in it. On success, registers it in SRS via the existing
// dedup-safe addSrsItem — repeated taps on the same word just refresh its review schedule.
async function lookupUnknownWord(rawWord, contextSentence, s) {
  const cleaned = (rawWord || "").replace(/^[^a-zA-Z']+|[^a-zA-Z']+$/g, "");
  if (!cleaned || s.wordLookupBusy) return;
  s.wordLookupBusy = true;
  s.wordLookupResult = null;
  renderWordLookupArea(s);
  const wb = findWordBankEntry(cleaned);
  let result = null;
  if (wb) {
    result = { jp: wb.jp, pos: wb.pos, note: "", ipa: (PRON[wb.w] || [])[0] || "", kana: (PRON[wb.w] || [])[1] || "" };
  } else {
    try {
      const sample = await getSample();
      if (sample) result = await sample.json(buildWordLookupPrompt(cleaned, contextSentence));
    } catch (e) {
      console.warn("word lookup failed", e);
      result = null;
    }
  }
  s.wordLookupBusy = false;
  if (result && result.jp && LOOKUP_STOPWORDS.has(cleaned.toLowerCase())) {
    s.wordLookupResult = { word: cleaned, jp: result.jp, pos: result.pos || "", note: result.note || "", added: true, skipped: true };
  } else if (result && result.jp) {
    const added = addSrsItem({ jp: result.jp, en: cleaned, type: "vocab", mistakeType: "unknown-word", importance: "medium", note: result.note || "" });
    if (added) { added.ipa = result.ipa || added.ipa || ""; added.kana = result.kana || added.kana || ""; saveState(); }
    s.wordLookupResult = { word: cleaned, jp: result.jp, pos: result.pos || "", note: result.note || "", ipa: result.ipa || "", kana: result.kana || "", added: true };
  } else {
    s.wordLookupResult = { word: cleaned, added: false };
  }
  renderWordLookupArea(s);
}

// Renders the small inline card showing a tapped word's meaning (or a failure state), just above
// the reply box. Re-run after every state change instead of a full renderConversation() so typing
// in progress in the reply textarea below isn't disturbed.
function renderWordLookupArea(s) {
  const el = document.getElementById("wordLookupArea");
  if (!el) return;
  if (s.wordLookupBusy) {
    el.innerHTML = `<div class="correctbox" style="margin-top:8px;">「${escapeHtml(s.wordLookupResult && s.wordLookupResult.word || "")}」の意味を調べています…</div>`;
    return;
  }
  const r = s.wordLookupResult;
  if (!r) { el.innerHTML = ""; return; }
  if (!r.added) {
    el.innerHTML = `
      <div class="correctbox" style="margin-top:8px;background:rgba(248,113,113,0.1);border-color:var(--bad);">
        <div style="display:flex;justify-content:space-between;align-items:start;">
          <b>「${escapeHtml(r.word)}」</b>
          <span id="wlClose" style="cursor:pointer;color:var(--muted);padding:0 4px;">×</span>
        </div>
        <div style="margin-top:4px;font-size:13px;color:var(--muted);">意味を取得できませんでした。もう一度タップしてみて。</div>
      </div>`;
  } else {
    el.innerHTML = `
      <div class="correctbox" style="margin-top:8px;">
        <div style="display:flex;justify-content:space-between;align-items:start;">
          <b>「${escapeHtml(r.word)}」</b>
          <span id="wlClose" style="cursor:pointer;color:var(--muted);padding:0 4px;">×</span>
        </div>
        <div style="margin-top:4px;">${r.pos ? `<span style="color:var(--muted);">${escapeHtml(r.pos)}</span> · ` : ""}${escapeHtml(r.jp)}</div>
        ${r.note ? `<div style="margin-top:4px;font-size:12.5px;color:var(--muted);">${escapeHtml(r.note)}</div>` : ""}
        ${pronHtml({ w: r.word, ipa: r.ipa, kana: r.kana })}
        ${r.skipped
          ? `<div style="margin-top:6px;font-size:12.5px;color:var(--muted);">基本語なので単語帳には追加していません。</div>`
          : `<div style="margin-top:6px;font-size:12.5px;color:var(--good);">✅ 単語帳に追加しました（Reviewに登場します）</div>`}
      </div>`;
  }
  const closeBtn = document.getElementById("wlClose");
  if (closeBtn) closeBtn.addEventListener("click", () => { s.wordLookupResult = null; renderWordLookupArea(s); });
}

function itemTargetWord(item) {
  if (item.type === "expression" || (item.type === "conversation" && item.expression)) {
    return { w: item.expression || item.en, jp: item.jp, accepted: [], alternatives: [], close: [], category: item.category || "", example: item.natural || null, exampleJp: null };
  }
  const wb = findWordBankEntry(item.en);
  return { ipa: item.ipa || "", kana: item.kana || "", w: item.en, jp: item.jp, accepted: (wb && wb.accepted) || [], alternatives: (wb && wb.alternatives) || [], close: (wb && wb.close) || [], category: (wb && wb.category) || "", example: wb ? wb.example : null, exampleJp: wb ? wb.exampleJp : null };
}
// Builds a fill-in-the-blank sentence for cloze-type review, from the word's own example
// (vocab) or by blanking the expression out of its corrected sentence (expression). Returns
// null when no sentence is available, so the caller can fall back to a different question type.
function buildClozeSentence(item) {
  if (item.type === "expression") {
    const natural = item.natural || "";
    const expr = item.expression || "";
    if (!natural || !expr) return null;
    const idx = natural.toLowerCase().indexOf(expr.toLowerCase());
    if (idx === -1) return null;
    return natural.slice(0, idx) + "____" + natural.slice(idx + expr.length);
  }
  const wb = findWordBankEntry(item.en);
  return wb ? wb.example.replace("___", "____") : null;
}
function buildSituationPrompt(item) {
  const cat = item.category || "この場面";
  return `${cat} の場面を想定して、この表現を使って英語で一文書いてみよう。`;
}

function renderReview() {
  if (!reviewSession) {
    const queue = prioritizeItems(dueTodayItems()).slice(0, 8);
    if (queue.length === 0) {
      main.innerHTML = `
        <div class="screen-head">
          <div class="backbtn" id="backHome">←</div>
          <div class="screen-title">復習</div>
        </div>
        <div class="empty"><div class="big">✅</div>本日の復習はありません。<br>明日また来るか、先に単語・会話を終えましょう。</div>
      `;
      document.getElementById("backHome").addEventListener("click", () => go("home"));
      return;
    }
    reviewSession = { queue, idx: 0, revealed: false, checking: false, currentType: null, evalResult: null, draftText: "" };
  }
  const s = reviewSession;

  if (s.idx >= s.queue.length) {
    markDoneToday("review"); // fires as soon as the session is actually complete, not gated behind a specific button
    main.innerHTML = `
      <div class="screen-head">
        <div class="backbtn" id="backHome">←</div>
        <div class="screen-title">復習<span class="sec">セッション完了</span></div>
      </div>
      <div class="resultcard">
        <div class="score">✓</div>
        <p class="msg">${s.queue.length}件を復習しました。次回の出題日を更新しました。</p>
        <button class="cta" id="toHomeBtn">ホームに戻る</button>
      </div>`;
    document.getElementById("backHome").addEventListener("click", () => go("home"));
    document.getElementById("toHomeBtn").addEventListener("click", () => go("home"));
    return;
  }

  const item = s.queue[s.idx];
  const target = itemTargetWord(item);
  if (!s.currentType) {
    let t = nextReviewType(item);
    if (t === "cloze" && !buildClozeSentence(item)) t = item.type === "expression" ? "situation" : "jp2en";
    s.currentType = t;
  }
  const type = s.currentType;
  const sourceBadge = item.type === "expression" || item.type === "conversation" ? "💬 会話Expression"
    : item.type === "vocab" ? "🔤 単語" : "✳️ サンプル";
  const head = `
    <div class="screen-head">
      <div class="backbtn" id="backHome">←</div>
      <div class="screen-title">復習<span class="sec">${s.idx+1} / ${s.queue.length}<span class="duebadge">${sourceBadge}</span></span></div>
    </div>
  `;

  if (type === "jp2en" || type === "en2jp" || type === "cloze") {
    const prompt = type === "jp2en" ? target.jp
      : type === "en2jp" ? target.w
      : buildClozeSentence(item);
    const hint = type === "jp2en" ? "この意味を英語で入力しよう"
      : type === "en2jp" ? "日本語の意味を入力しよう"
      : "空欄に入る語句を入力しよう";
    const placeholder = type === "en2jp" ? "日本語で入力…" : "英語で入力…";
    main.innerHTML = head + `
      <div class="reviewcard">
        <div class="jp" style="font-size:${type === 'cloze' ? '18px' : '22px'};">${prompt}</div>
        <div class="hint" style="margin-bottom:14px;">${hint}</div>
        <input class="answer" id="revAns" placeholder="${placeholder}" autocomplete="off" ${s.revealed || s.checking ? "disabled" : ""}>
        ${s.revealed ? "" : `<button class="cta" id="revSubmit" ${s.checking ? "disabled" : ""}>${s.checking ? "判定中…" : "確認"}</button>`}
        ${s.revealed ? renderItemFeedback(type, target, s, item) + pronHtml(target) : ""}
        ${s.revealed ? `<button class="cta" id="revNext" style="margin-top:12px;width:100%;">次へ</button>` : ""}
      </div>
    `;
    document.getElementById("backHome").addEventListener("click", () => go("home"));
    if (!s.revealed) {
      const inputEl = document.getElementById("revAns");
      const btn = document.getElementById("revSubmit");
      if (!s.checking) inputEl.focus();
      const doCheck = async () => {
        const val = inputEl.value.trim();
        if (!val || s.checking) return;
        s.lastInput = val;
        s.checking = true; render();
        if (type === "en2jp") {
          s.lastVerdict = await classifyJapaneseAnswer(val, target);
          s.lastNatural = null; s.lastNote = null;
        } else {
          const ctx = type === "cloze" ? buildClozeSentence(item) : null;
          const res = await classifyEnglishAnswer(val, target, ctx);
          s.lastVerdict = res.verdict; s.lastNatural = res.natural || null; s.lastNote = res.note || null;
        }
        // Grade immediately: the SRS item's dueDate is updated right here, so the feedback
        // card shown below already reflects the real, current next-review date.
        reviewSrsItem(item, s.lastVerdict, type);
        s.checking = false; s.revealed = true; render();
      };
      btn.addEventListener("click", doCheck);
      inputEl.addEventListener("keydown", e => { if (e.key === "Enter") doCheck(); });
    } else {
      document.getElementById("revNext").addEventListener("click", () => goNext());
    }
    return;
  }

  // situation / produce: free English writing, judged by the same AI coach used in Vocabulary's produce type
  const isSituation = type === "situation";
  main.innerHTML = head + `
    <div class="reviewcard">
      <div class="jp" style="font-size:18px;">${isSituation ? buildSituationPrompt(item) : `「${target.jp}」を使って英文を作ってみよう`}</div>
      <div class="hint" style="margin-bottom:14px;">対象表現：${target.w}</div>
      <textarea class="answer" id="revProduce" placeholder="英語で入力してください…" ${s.checking ? "disabled" : ""}>${s.draftText || ""}</textarea>
      ${s.evalResult ? "" : `<button class="cta" id="revProduceCheck" ${s.checking ? "disabled" : ""} style="width:100%;">${s.checking ? "確認中…" : "添削してもらう"}</button>`}
      ${s.inputWarning && !s.evalResult ? `<div style="margin:8px 0;font-size:13px;color:var(--accent);font-weight:600;">⚠️ ${s.inputWarning}</div>` : ""}
      <div id="revEvalArea"></div>
      ${s.evalResult ? `<button class="cta" id="revNext" style="width:100%;margin-top:6px;">次へ</button>` : ""}
    </div>
  `;
  document.getElementById("backHome").addEventListener("click", () => go("home"));
  if (s.evalResult) {
    const r = s.evalResult;
    const usageLine = r.wordUsed
      ? `<div style="margin:10px 0;font-size:13px;color:var(--good);font-weight:600;">✅ 「${target.w}」を使えています。</div>`
      : r.spellingMiss
        ? `<div style="margin:10px 0;font-size:13px;color:var(--bad);font-weight:600;">❌ スペルミス：「${escapeHtml(r.spellingMiss.typed)}」→「${escapeHtml(r.spellingMiss.expected)}」</div>`
        : `<div style="margin:10px 0;font-size:13px;color:var(--bad);font-weight:600;">❌ 「${target.w}」がまだ使われていません。</div>`;
    document.getElementById("revEvalArea").innerHTML = usageLine
      + (s.aiFailed ? `<div style="margin:6px 0;font-size:12.5px;color:var(--muted);">※ AI添削に接続できなかったため、文法・自然さは判定していません。</div>` : "")
      + renderEvalCard(r)
      + pronHtml(target)
      + (item.note ? `<div style="margin-top:8px;font-size:12.5px;color:var(--muted);"><b>覚えておくポイント：</b> ${item.note}</div>` : "")
      + `<div style="margin-top:10px;font-size:13px;color:var(--muted);">📅 ${formatDueLabel(item.dueDate)}</div>`;
    document.getElementById("revNext").addEventListener("click", () => goNext());
  } else {
    const ta = document.getElementById("revProduce");
    ta.addEventListener("input", () => { s.draftText = ta.value; });
    document.getElementById("revProduceCheck").addEventListener("click", async () => {
      const text = ta.value.trim();
      if (!text || s.checking) return;
      // 文になっていない入力（「Dr」など）は採点せず、書き直してもらう。
      if (englishWordCount(text) < 3) {
        s.draftText = text; s.inputWarning = "3語以上の英文で書いてみよう（採点はしていません）。"; render();
        return;
      }
      s.inputWarning = null;
      s.checking = true; s.draftText = text; render();
      const localWordUsed = containsTargetWord(text, target);
      let result;
      const sample = await getSample();
      try { result = await sample.json(buildVocabProducePrompt(target, text)); }
      catch (e) {
        console.warn("review produce sample failed", e);
        // AIが使えないときは文法・自然さを「OK」と偽らず、判定なしとして扱う。
        result = { grammarCorrect: null, grammarNote: "", naturalness: null, naturalNote: "", better: "", points: [], issueFound: true, issueCategory: "word-usage", mistakeType: "word-usage", importance: "medium" };
        s.aiFailed = true;
      }
      // 使用チェックはAIに任せず、ローカル判定を常に優先する。
      result.wordUsed = localWordUsed;
      result.spellingMiss = localWordUsed ? null : findSpellingNearMiss(text, target);
      // Grade immediately, same as the recall types above, so the countdown shown is current.
      reviewSrsItem(item, (result.wordUsed && result.grammarCorrect === true) ? "correct" : "incorrect", type);
      s.checking = false; s.evalResult = result; render();
    });
  }

  function goNext() {
    s.idx += 1;
    s.revealed = false; s.checking = false; s.currentType = null;
    s.evalResult = null; s.draftText = ""; s.inputWarning = null; s.aiFailed = false;
    render();
  }
}

function renderItemFeedback(type, target, s, item) {
  const verdict = s.lastVerdict;
  const dueLine = `<div style="margin-top:8px;font-size:12.5px;color:var(--muted);">📅 ${formatDueLabel(item.dueDate)}</div>`;
  // The reason this item was originally added to Review — persisted at creation time, resurfaced
  // every time it's reviewed (not just on first encounter), regardless of today's verdict.
  const savedNoteLine = item.note ? `<div style="margin-top:6px;font-size:12.5px;color:var(--muted);"><b>覚えておくポイント：</b> ${item.note}</div>` : "";
  const jpMeaningLine = type === "cloze" ? `<div style="margin-top:6px;"><b>意味：</b> ${target.jp}</div>` : "";
  const sentenceJpLine = (type === "cloze" && target.exampleJp) ? `<div style="margin-top:2px;"><b>例文の訳：</b> ${target.exampleJp}</div>` : "";
  if (type === "en2jp") {
    if (verdict === "correct") return `<div class="correctbox"><div class="lbl">✅ 正解</div>${target.jp}${savedNoteLine}${dueLine}</div>`;
    if (verdict === "close") return `
      <div class="correctbox" style="background:rgba(232,90,42,0.1);border-color:var(--accent);">
        <div class="lbl" style="color:var(--accent);">△ 惜しい</div>
        <div style="margin:6px 0 2px;"><b>あなたの回答：</b> ${escapeHtml(s.lastInput || "")}</div>
        <div style="margin:2px 0;"><b>正確な意味：</b> ${target.jp}</div>
        ${savedNoteLine}${dueLine}
      </div>`;
    return `
      <div class="correctbox" style="background:rgba(248,113,113,0.1);border-color:var(--bad);">
        <div class="lbl" style="color:var(--bad);">❌ 不正解</div>
        <div style="margin:6px 0 2px;"><b>あなたの回答：</b> ${escapeHtml(s.lastInput || "")}</div>
        <div style="margin:2px 0;"><b>正解：</b> ${target.jp}</div>
        ${savedNoteLine}${dueLine}
      </div>`;
  }
  const natural = s.lastNatural || target.w;
  const showNatural = normalizeWord(natural) !== normalizeWord(s.lastInput || "");
  if (verdict === "correct") return `
    <div class="correctbox"><div class="lbl">✅ 正解</div>「${escapeHtml(s.lastInput || "")}」で正解です。
      ${showNatural ? `<div style="margin-top:6px;"><b>より自然な表現：</b> ${natural}</div>` : ""}
      ${jpMeaningLine}${sentenceJpLine}${savedNoteLine}${dueLine}
    </div>`;
  if (verdict === "close") return `
    <div class="correctbox" style="background:rgba(232,90,42,0.1);border-color:var(--accent);">
      <div class="lbl" style="color:var(--accent);">△ 惜しい</div>
      <div style="margin:6px 0 2px;"><b>あなたの回答：</b> ${escapeHtml(s.lastInput || "")}</div>
      <div style="margin:2px 0;"><b>より自然な表現：</b> ${natural}</div>
      <div style="margin:2px 0;"><b>ポイント：</b> ${s.lastNote || "方向性は合っているが、この文脈での代表的な表現ではない。"}</div>
      ${jpMeaningLine}${sentenceJpLine}${savedNoteLine}${dueLine}
    </div>`;
  return `
    <div class="correctbox" style="background:rgba(248,113,113,0.1);border-color:var(--bad);">
      <div class="lbl" style="color:var(--bad);">❌ 不正解</div>
      <div style="margin:6px 0 2px;"><b>あなたの回答：</b> ${escapeHtml(s.lastInput || "")}</div>
      <div style="margin:2px 0;"><b>正解例：</b> ${target.w}</div>
      <div style="margin:2px 0;"><b>より自然な表現：</b> ${natural}</div>
      <div style="margin:2px 0;"><b>ポイント：</b> ${s.lastNote || "意味を正確に思い出そう。"}</div>
      ${jpMeaningLine}${sentenceJpLine}${savedNoteLine}${dueLine}
    </div>`;
}

/* ==================================================================
   TEST — Vocabulary Test / Expression Test / Conversation Test / Weekly Test.
   Expression Test and Weekly Test share one engine (runSrsTest) since both just
   run a list of existing SRS items (vocab and/or expression) through the same
   generic judging pipeline already used by Review — answering here directly
   updates those items' real SRS schedule, so there is no separate "register
   weak points" step for them: grading IS the re-registration, with zero risk
   of duplicates because these are the same item objects, not new ones.
   ================================================================== */
const MISTAKE_LABELS = {
  tense: "時制", preposition: "前置詞", article: "冠詞", "word-choice": "語彙選択",
  "word-order": "語順", collocation: "コロケーション", phrasing: "言い回し",
  "word-usage": "単語の使用", grammar: "文法", naturalness: "自然さ",
  "jp2en": "英単語の想起", "en2jp": "意味の想起", cloze: "穴埋め", produce: "英作文", "unknown-word": "知らない単語", other: "その他"
};
function weakPointLabel(key) { return MISTAKE_LABELS[key] || key; }
function tallyWeakPoints(tally, key) { if (!key) return; tally[key] = (tally[key] || 0) + 1; }
function topWeakPoints(tally, n) {
  return Object.entries(tally).sort((a, b) => b[1] - a[1]).slice(0, n || 4).map(([k]) => weakPointLabel(k));
}

function renderTest() {
  if (!testSession) {
    main.innerHTML = `
      <div class="screen-head">
        <div class="backbtn" id="backHome">←</div>
        <div class="screen-title">テスト<span class="sec">定着度を確認しよう</span></div>
      </div>
      <div class="themegrid">
        <div class="themebtn" data-mode="vocabTest"><div>Vocabulary Test<div class="jp">これまでの単語から出題</div></div><div class="arrow">→</div></div>
        <div class="themebtn" data-mode="expressionTest"><div>Expression Test<div class="jp">会話で登録したExpressionから出題</div></div><div class="arrow">→</div></div>
        <div class="themebtn" data-mode="convoTest"><div>Conversation Test<div class="jp">1つの場面で自由英作文</div></div><div class="arrow">→</div></div>
        <div class="themebtn" data-mode="weeklyTest"><div>Weekly Test<div class="jp">今週学んだ内容をまとめて確認</div></div><div class="arrow">→</div></div>
      </div>
      <p style="font-size:12.5px;color:var(--muted);margin-top:16px;">Monthly Testは準備中です。</p>
    `;
    document.getElementById("backHome").addEventListener("click", () => go("home"));
    main.querySelectorAll(".themebtn").forEach(el => {
      el.addEventListener("click", () => startTest(el.dataset.mode));
    });
    return;
  }
  if (testSession.mode === "empty") {
    main.innerHTML = `
      <div class="screen-head">
        <div class="backbtn" id="backToMenu">←</div>
        <div class="screen-title">テスト</div>
      </div>
      <div class="empty"><div class="big">📭</div>${testSession.message}</div>
    `;
    document.getElementById("backToMenu").addEventListener("click", () => { testSession = null; render(); });
    return;
  }
  if (testSession.mode === "vocabTest") return renderVocabTest();
  if (testSession.mode === "srsTest") return renderSrsTest();
  if (testSession.mode === "convoTest") return renderConvoTest();
}

function startTest(mode) {
  if (mode === "vocabTest") {
    testSession = { mode: "vocabTest", items: buildVocabItems(8, ["jp2en", "en2jp", "cloze", "mcq"]), idx: 0, correct: 0, close: 0, wrong: 0, tally: {}, revealed: false, checking: false, evalResult: null };
  } else if (mode === "expressionTest") {
    const pool = state.srsItems.filter(i => i.type === "expression");
    if (!pool.length) { testSession = { mode: "empty", message: "まだ登録されたExpressionがありません。Conversationを進めると増えていきます。" }; render(); return; }
    testSession = { mode: "srsTest", title: "Expression Test", queue: shuffle(pool).slice(0, 6), idx: 0, correct: 0, close: 0, wrong: 0, tally: {}, revealed: false, checking: false, currentType: null, evalResult: null };
  } else if (mode === "weeklyTest") {
    const weekAgo = addDaysIso(todayStr(), -7);
    const pool = state.srsItems.filter(i => (i.createdAt || "") >= weekAgo && i.type !== "seed");
    if (!pool.length) { testSession = { mode: "empty", message: "今週はまだ復習対象がありません。VocabularyとConversationを進めよう。" }; render(); return; }
    testSession = { mode: "srsTest", title: "Weekly Test", queue: shuffle(pool).slice(0, 8), idx: 0, correct: 0, close: 0, wrong: 0, tally: {}, revealed: false, checking: false, currentType: null, evalResult: null };
  } else if (mode === "convoTest") {
    testSession = { mode: "convoTest", situation: CONVERSATIONS[Math.floor(Math.random() * CONVERSATIONS.length)], phase: "answer", checking: false, evalResult: null };
  }
  render();
}

/* ---- Vocabulary Test ---- */
function renderVocabTest() {
  const s = testSession;
  if (s.idx >= s.items.length) return renderTestResults(s, "Vocabulary Test");
  const it = s.items[s.idx];
  const w = it.word;
  const head = `
    <div class="screen-head">
      <div class="backbtn" id="backToMenu">←</div>
      <div class="screen-title">Vocabulary Test<span class="sec">問題 ${s.idx+1} / ${s.items.length}</span></div>
    </div>
    <div class="progressbar"><div style="width:${(s.idx/s.items.length)*100}%"></div></div>
  `;
  function toMenu() { testSession = null; render(); }
  function gradeItem(verdict, kind) {
    tallyWeakPoints(s.tally, kind || it.type);
    if (verdict === "correct") s.correct++; else if (verdict === "close") { s.close++; } else s.wrong++;
    if (verdict !== "correct") addSrsItem({ jp: w.jp, en: w.w, mistakeType: it.type, importance: verdict === "close" ? "low" : "medium", note: s.lastNote || "" });
  }
  function goNext() {
    s.idx++; s.revealed = false; s.checking = false; s.evalResult = null;
    render();
  }

  if (it.type === "mcq") {
    main.innerHTML = head + `
      <div class="qword"><div class="w">${w.w}</div><div class="hint">この単語の意味は？</div></div>
      <div class="options" id="opts">${it.options.map(o => `<button class="opt" data-val="${o}">${o}</button>`).join("")}</div>`;
    document.getElementById("backToMenu").addEventListener("click", toMenu);
    main.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => {
      if (s.revealed) return;
      s.revealed = true;
      const ok = btn.dataset.val === w.jp;
      main.querySelectorAll(".opt").forEach(b => { b.disabled = true; if (b.dataset.val === w.jp) b.classList.add("correct"); else if (b === btn) b.classList.add("wrong"); });
      gradeItem(ok ? "correct" : "incorrect", "mcq"); // graded now, not after the delay — the delay is purely visual
      setTimeout(() => goNext(), 700);
    }));
    return;
  }

  const prompt = it.type === "jp2en" ? w.jp : it.type === "en2jp" ? w.w : w.example.replace("___", "＿＿＿");
  const placeholder = it.type === "en2jp" ? "日本語で入力…" : "英語で入力…";
  const wordStyle = it.type === "en2jp"
    ? "font-family:'Bebas Neue','Inter',sans-serif;font-size:36px;"
    : it.type === "cloze"
      ? "font-family:'Inter',sans-serif;font-weight:700;font-size:19px;line-height:1.5;"
      : "font-family:'Inter',sans-serif;font-weight:700;font-size:28px;line-height:1.3;";
  main.innerHTML = head + `
    <div class="qword"><div class="w" style="${wordStyle}">${prompt}</div></div>
    <input class="answer" id="tAns" placeholder="${placeholder}" autocomplete="off" ${s.revealed || s.checking ? "disabled" : ""}>
    ${s.revealed ? "" : `<button class="cta" id="tCheck" ${s.checking ? "disabled" : ""}>${s.checking ? "判定中…" : "確認"}</button>`}
    <div id="tFb"></div>
    ${s.revealed ? `<button class="cta" id="tNext" style="margin-top:12px;width:100%;">次へ</button>` : ""}
  `;
  document.getElementById("backToMenu").addEventListener("click", toMenu);
  if (!s.revealed) {
    const inputEl = document.getElementById("tAns");
    if (!s.checking) inputEl.focus();
    const doCheck = async () => {
      const val = inputEl.value.trim();
      if (!val || s.checking) return;
      s.lastInput = val; s.checking = true; render();
      if (it.type === "en2jp") { s.lastVerdict = await classifyJapaneseAnswer(val, w); }
      else {
        const ctx = it.type === "cloze" ? w.example.replace("___", "____") : null;
        const res = await classifyEnglishAnswer(val, w, ctx);
        s.lastVerdict = res.verdict; s.lastNatural = res.natural; s.lastNote = res.note || null;
      }
      gradeItem(s.lastVerdict, it.type); // graded now, at reveal time
      s.checking = false; s.revealed = true; render();
    };
    document.getElementById("tCheck").addEventListener("click", doCheck);
    inputEl.addEventListener("keydown", e => { if (e.key === "Enter") doCheck(); });
  } else {
    const v = s.lastVerdict;
    document.getElementById("tFb").innerHTML = v === "correct"
      ? `<div class="correctbox"><div class="lbl">✅ 正解</div>${it.type === "en2jp" ? w.jp : w.w}</div>`
      : v === "close"
        ? `<div class="correctbox" style="background:rgba(232,90,42,0.1);border-color:var(--accent);"><div class="lbl" style="color:var(--accent);">△ 惜しい</div>正解：${it.type === "en2jp" ? w.jp : w.w}</div>`
        : `<div class="correctbox" style="background:rgba(248,113,113,0.1);border-color:var(--bad);"><div class="lbl" style="color:var(--bad);">❌ 不正解</div>正解：${it.type === "en2jp" ? w.jp : w.w}</div>`;
    document.getElementById("tNext").addEventListener("click", () => goNext());
  }
}

/* ---- Expression Test / Weekly Test (shared engine over existing SRS items) ---- */
function renderSrsTest() {
  const s = testSession;
  if (s.idx >= s.queue.length) return renderTestResults(s, s.title);
  const item = s.queue[s.idx];
  const target = itemTargetWord(item);
  if (!s.currentType) {
    let t = nextReviewType(item);
    if (t === "cloze" && !buildClozeSentence(item)) t = item.type === "expression" ? "situation" : "jp2en";
    if (t === "produce" || t === "situation") t = "jp2en"; // keep the Test flow to quick-answer formats
    s.currentType = t;
  }
  const type = s.currentType;
  function toMenu() { testSession = null; render(); }
  function gradeItem(verdict) {
    tallyWeakPoints(s.tally, item.mistakeType || type);
    if (verdict === "correct") s.correct++; else if (verdict === "close") s.close++; else s.wrong++;
    reviewSrsItem(item, verdict, type);
  }
  function goNext() {
    s.idx++; s.revealed = false; s.checking = false; s.currentType = null;
    render();
  }
  const head = `
    <div class="screen-head">
      <div class="backbtn" id="backToMenu">←</div>
      <div class="screen-title">${s.title}<span class="sec">問題 ${s.idx+1} / ${s.queue.length}</span></div>
    </div>
    <div class="progressbar"><div style="width:${(s.idx/s.queue.length)*100}%"></div></div>
  `;
  const prompt = type === "jp2en" ? target.jp : type === "en2jp" ? target.w : buildClozeSentence(item);
  const placeholder = type === "en2jp" ? "日本語で入力…" : "英語で入力…";
  const wordStyle = type === "en2jp"
    ? "font-family:'Bebas Neue','Inter',sans-serif;font-size:30px;"
    : type === "cloze"
      ? "font-family:'Inter',sans-serif;font-weight:700;font-size:18px;line-height:1.5;"
      : "font-family:'Inter',sans-serif;font-weight:700;font-size:24px;line-height:1.3;";
  main.innerHTML = head + `
    <div class="qword"><div class="w" style="${wordStyle}">${prompt}</div>
    <div class="hint">${item.type === "expression" ? "💬 Expression" : "🔤 単語"}</div></div>
    <input class="answer" id="tAns" placeholder="${placeholder}" autocomplete="off" ${s.revealed || s.checking ? "disabled" : ""}>
    ${s.revealed ? "" : `<button class="cta" id="tCheck" ${s.checking ? "disabled" : ""}>${s.checking ? "判定中…" : "確認"}</button>`}
    <div id="tFb"></div>
    ${s.revealed ? `<button class="cta" id="tNext" style="margin-top:12px;width:100%;">次へ</button>` : ""}
  `;
  document.getElementById("backToMenu").addEventListener("click", toMenu);
  if (!s.revealed) {
    const inputEl = document.getElementById("tAns");
    if (!s.checking) inputEl.focus();
    const doCheck = async () => {
      const val = inputEl.value.trim();
      if (!val || s.checking) return;
      s.lastInput = val; s.checking = true; render();
      if (type === "en2jp") { s.lastVerdict = await classifyJapaneseAnswer(val, target); }
      else {
        const ctx = type === "cloze" ? buildClozeSentence(item) : null;
        const res = await classifyEnglishAnswer(val, target, ctx);
        s.lastVerdict = res.verdict;
      }
      gradeItem(s.lastVerdict); // graded now, at reveal time — SRS/tally already saved before the user sees "次へ"
      s.checking = false; s.revealed = true; render();
    };
    document.getElementById("tCheck").addEventListener("click", doCheck);
    inputEl.addEventListener("keydown", e => { if (e.key === "Enter") doCheck(); });
  } else {
    const v = s.lastVerdict;
    const ref = type === "en2jp" ? target.jp : target.w;
    document.getElementById("tFb").innerHTML = v === "correct"
      ? `<div class="correctbox"><div class="lbl">✅ 正解</div>${ref}</div>`
      : v === "close"
        ? `<div class="correctbox" style="background:rgba(232,90,42,0.1);border-color:var(--accent);"><div class="lbl" style="color:var(--accent);">△ 惜しい</div>正解：${ref}</div>`
        : `<div class="correctbox" style="background:rgba(248,113,113,0.1);border-color:var(--bad);"><div class="lbl" style="color:var(--bad);">❌ 不正解</div>正解：${ref}</div>`;
    document.getElementById("tNext").addEventListener("click", () => goNext());
  }
}

/* ---- Conversation Test (single free-response scenario) ---- */
function buildConvoTestPrompt(situation, text) {
  return `You are grading Etsu's (a Japanese university runner, upper-beginner/intermediate ESL) free English response to a realistic teammate/coach scenario, for a test — not an ongoing chat.

Situation (${situation.category || situation.title}, ${situation.jp}): "${situation.prompt}"
Etsu's response: "${text}"

Evaluate holistically. CRITICAL: never add facts, numbers, feelings, or details Etsu did not state — "better" must preserve his exact meaning, only fixed/polished.

Reply with STRICT JSON only, no markdown fences:
{
 "meaningConveyed": boolean,
 "grammarCorrect": boolean,
 "grammarNote": "short Japanese note",
 "naturalness": "one of: natural | more_natural_available | unnatural",
 "naturalNote": "short Japanese note",
 "vocabularyNote": "short Japanese note on word choice appropriateness for this context",
 "expressionNote": "short Japanese note on whether he used natural running/team-context expressions",
 "practicalityNote": "short Japanese note on whether this response would actually work in a real conversation with a teammate/coach",
 "better": "a natural version preserving EXACTLY his stated meaning, nothing added",
 "betterJp": "a short, natural Japanese translation of \"better\" (so Etsu can instantly check the meaning)",
 "points": ["at most 3 short Japanese notes on what to improve"],
 "weakAreas": ["subset of: grammar, naturalness, vocabulary, expression, practicality — only ones that actually need work"],
 "expression": "optional: one reusable phrase from 'better' worth drilling later, or empty string",
 "expressionJp": "Japanese meaning of that phrase, or empty string"
}`;
}
function fallbackConvoTestEval(text) {
  const t = text.trim();
  return {
    meaningConveyed: true, grammarCorrect: true, grammarNote: "", naturalness: "natural", naturalNote: "",
    vocabularyNote: "", expressionNote: "", practicalityNote: "",
    better: lightCleanup(t), points: [], weakAreas: [], expression: "", expressionJp: ""
  };
}
function renderConvoTest() {
  const s = testSession;
  const sit = s.situation;
  function toMenu() { testSession = null; render(); }
  if (s.phase === "answer") {
    main.innerHTML = `
      <div class="screen-head">
        <div class="backbtn" id="backToMenu">←</div>
        <div class="screen-title">Conversation Test<span class="sec">${sit.jp}</span></div>
      </div>
      <div class="bubble npc"><div class="who">${sit.who}</div>${sit.prompt}</div>
      <textarea class="answer" id="ctAns" placeholder="英語で返信してください…" ${s.checking ? "disabled" : ""}></textarea>
      <button class="cta" id="ctCheck" ${s.checking ? "disabled" : ""} style="width:100%;">${s.checking ? "確認中…" : "提出する"}</button>
    `;
    document.getElementById("backToMenu").addEventListener("click", toMenu);
    document.getElementById("ctCheck").addEventListener("click", async () => {
      const ta = document.getElementById("ctAns");
      const text = ta.value.trim();
      if (!text || s.checking) return;
      s.checking = true; s.userText = text; render();
      const sample = await getSample();
      let result;
      if (!sample) result = fallbackConvoTestEval(text);
      else {
        try { result = await sample.json(buildConvoTestPrompt(sit, text)); }
        catch (e) { console.warn("convo test sample failed", e); result = fallbackConvoTestEval(text); }
      }
      s.checking = false; s.evalResult = result; s.phase = "result"; render();
    });
    return;
  }

  const r = s.evalResult;
  const rows = [
    ["意味が伝わったか", r.meaningConveyed ? "✅ 伝わっている" : "❌ 伝わりにくい"],
    ["Grammar", (r.grammarCorrect ? "✅ " : "△ ") + (r.grammarNote || (r.grammarCorrect ? "問題なし" : ""))],
    ["Naturalness", r.naturalNote || (r.naturalness === "natural" ? "自然" : "改善の余地あり")],
    ["Vocabulary", r.vocabularyNote || "—"],
    ["Expression", r.expressionNote || "—"],
    ["Practicality", r.practicalityNote || "—"]
  ];
  main.innerHTML = `
    <div class="screen-head">
      <div class="backbtn" id="backToMenu">←</div>
      <div class="screen-title">Conversation Test<span class="sec">結果</span></div>
    </div>
    <div class="bubble me"><div class="who">You</div>${escapeHtml(s.userText)}</div>
    <div class="evalcard"><div class="row better"><div class="k">より自然な英語</div><div>${r.better}</div></div></div>
    ${rows.map(([k, v]) => `<div class="evalcard"><div class="row"><div class="k">${k}</div><div>${v}</div></div></div>`).join("")}
    ${(r.points && r.points.length) ? `<div class="evalcard"><div class="row point"><div class="k">ポイント</div><div>${r.points.join(" / ")}</div></div></div>` : ""}
    <button class="cta" id="ctDone" style="width:100%;margin-top:10px;">テストメニューに戻る</button>
  `;
  document.getElementById("backToMenu").addEventListener("click", toMenu);
  document.getElementById("ctDone").addEventListener("click", () => {
    if (r.expression) {
      addExpressionSrsItem({ expression: r.expression, expressionJp: r.expressionJp, userOriginal: s.userText, natural: r.better, category: sit.category || sit.title, importance: "medium", mistakeType: (r.weakAreas && r.weakAreas[0]) || "phrasing", note: (r.points && r.points[0]) || "" });
    }
    testSession = null;
    go("home");
  });
}

/* ---- Shared results screen for Vocabulary Test / Expression Test / Weekly Test ---- */
function renderTestResults(s, title) {
  const total = s.correct + s.close + s.wrong;
  const weak = topWeakPoints(s.tally, 4);
  main.innerHTML = `
    <div class="screen-head">
      <div class="backbtn" id="backToMenu">←</div>
      <div class="screen-title">${title}<span class="sec">結果</span></div>
    </div>
    <div class="resultcard">
      <div class="score">${s.correct}/${total}</div>
      <p class="msg">△惜しい：${s.close}件　❌不正解：${s.wrong}件</p>
    </div>
    ${weak.length ? `
      <div class="evalcard">
        <div class="row"><div class="k">Weak Points</div><div>${weak.join(" / ")}</div></div>
      </div>
      <p style="font-size:12.5px;color:var(--muted);margin:4px 8px 16px;">これらは復習キューに反映されています。</p>
    ` : `<div class="empty"><div class="big">🎯</div>弱点は見つかりませんでした。</div>`}
    <button class="cta" id="toMenuBtn" style="width:100%;">テストメニューに戻る</button>
  `;
  document.getElementById("backToMenu").addEventListener("click", () => { testSession = null; go("home"); });
  document.getElementById("toMenuBtn").addEventListener("click", () => { testSession = null; render(); });
}

render();
</script>
</body>
</html>
